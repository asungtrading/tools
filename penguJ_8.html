<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PenguJ_8 — Number Belt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#17181d; --ink-soft:#5b5d69; --ink-faint:#9a9ca8;
    --paper:#eceef2; --card:#ffffff; --line:#e2e4ea; --line-soft:#eef0f4;
    --brand:#4b45b2; --brand-soft:#ecebfa;
    --ok:#2f9e5f; --ok-soft:#e6f5ec;
    --grit:#e8873b; --grit-soft:#fbeee1;
    --nope:#d6483b; --nope-soft:#fbe9e7;
    --belt-white:#d9dbe1; --belt-yellow:#f4c531; --belt-orange:#e8873b;
    --belt-green:#4fa361; --belt-blue:#3b7dd8; --belt-red:#d6483b; --belt-black:#23252b;
    --shadow:0 1px 2px rgba(20,22,30,.05), 0 8px 24px rgba(20,22,30,.06);
    --font: "Nunito", ui-rounded, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:var(--font); color:var(--ink); background:var(--paper);
    -webkit-font-smoothing:antialiased; line-height:1.5; min-height:100vh;}
  .wrap{max-width:640px; margin:0 auto; padding:20px 18px 64px;}
  .topbar{display:flex; align-items:center; gap:12px; margin-bottom:20px;}
  .logo{font-weight:900; font-size:19px; letter-spacing:-.02em; display:flex; align-items:center; gap:9px;}
  .logo .mark{width:26px; height:26px; border-radius:8px; background:var(--brand); position:relative; flex:none;}
  .logo .mark::after{content:""; position:absolute; left:5px; right:5px; top:10px; height:6px; border-radius:3px; background:#fff;}
  .spacer{flex:1}
  .ghostbtn{font-family:var(--font); font-weight:700; font-size:13px; color:var(--ink-soft);
    background:transparent; border:1.5px solid var(--line); border-radius:999px; padding:7px 14px; cursor:pointer;}
  .ghostbtn:hover{border-color:var(--ink-faint); color:var(--ink)}
  .card{background:var(--card); border:1px solid var(--line); border-radius:18px; box-shadow:var(--shadow); padding:22px;}
  .card + .card{margin-top:16px;}
  h1{font-size:23px; font-weight:900; letter-spacing:-.02em; margin:0 0 4px;}
  h2{font-size:18px; font-weight:800; letter-spacing:-.01em; margin:0 0 10px;}
  .sub{color:var(--ink-soft); font-weight:600; font-size:14px; margin:0;}
  .eyebrow{font-size:12px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--brand); margin:0 0 8px;}
  .ladder{display:flex; gap:7px; margin:18px 0 4px;}
  .rung{flex:1; height:10px; border-radius:6px; background:var(--line);}
  .rung.done{background:var(--rc, var(--brand));}
  .rung.current{background:var(--rc, var(--brand)); box-shadow:0 0 0 3px rgba(75,69,178,.16);}
  .ladder-labels{display:flex; gap:7px; margin-bottom:2px;}
  .ladder-labels span{flex:1; text-align:center; font-size:10px; font-weight:800; color:var(--ink-faint); text-transform:capitalize;}
  .ladder-labels span.current{color:var(--ink)}
  .beltbadge{display:inline-flex; align-items:center; gap:8px; font-weight:800; font-size:13px;
    padding:6px 13px; border-radius:999px; background:var(--paper); color:var(--ink);}
  .beltbadge .dot{width:13px; height:13px; border-radius:4px; border:1px solid rgba(0,0,0,.15);}
  .levelchip{display:inline-flex; align-items:center; gap:6px; font-weight:800; font-size:12px; color:var(--brand);
    background:var(--brand-soft); padding:5px 11px; border-radius:999px;}
  .cta{display:block; width:100%; font-family:var(--font); font-weight:900; font-size:17px; color:#fff;
    background:var(--brand); border:none; border-radius:14px; padding:16px; cursor:pointer; letter-spacing:-.01em;
    transition:transform .06s ease, filter .15s ease;}
  .cta:hover{filter:brightness(1.06)}
  .cta:active{transform:scale(.985)}
  .cta.secondary{background:var(--card); color:var(--brand); border:1.5px solid var(--brand);}
  .cta.calm{background:var(--card); color:var(--ink-soft); border:1.5px solid var(--line); font-size:15px;}
  .stats{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:14px;}
  .stat{background:var(--paper); border-radius:12px; padding:12px; text-align:center;}
  .stat .n{font-size:22px; font-weight:900; line-height:1;}
  .stat .l{font-size:11px; font-weight:700; color:var(--ink-soft); margin-top:5px;}
  .mbar{height:12px; background:var(--line); border-radius:7px; overflow:hidden; margin:4px 0;}
  .mfill{height:100%; border-radius:7px; transition:width .4s ease; background:var(--brand);}
  .mlabel{display:flex; justify-content:space-between; font-size:12px; font-weight:800; color:var(--ink-soft); margin-top:8px;}
  .frame{display:flex; gap:6px; margin:2px 0 18px; flex-wrap:wrap;}
  .fstep{flex:1; min-width:64px; text-align:center; font-size:11px; font-weight:800; padding:8px 4px; border-radius:10px;
    background:var(--line-soft); color:var(--ink-faint); border:1.5px solid transparent;}
  .fstep .fn{display:block; font-size:14px; font-weight:900;}
  .fstep.active{background:var(--brand-soft); color:var(--brand); border-color:var(--brand);}
  .fstep.done{background:var(--ok-soft); color:var(--ok);}
  .qbox{background:var(--paper); border-radius:14px; padding:16px 18px; font-size:16px; font-weight:600; margin-bottom:16px; line-height:1.55;}
  .qbox b{font-weight:900;}
  .prompt{font-size:16px; font-weight:800; margin:0 0 12px;}
  .opts{display:flex; flex-direction:column; gap:9px;}
  .opt{display:flex; align-items:center; gap:11px; text-align:left; width:100%; font-family:var(--font);
    font-size:15px; font-weight:700; color:var(--ink); background:var(--card); border:1.5px solid var(--line);
    border-radius:12px; padding:13px 15px; cursor:pointer; transition:border-color .12s, background .12s;}
  .opt:hover{border-color:var(--ink-faint);}
  .opt .box{width:22px; height:22px; border-radius:7px; border:2px solid var(--line); flex:none; display:flex; align-items:center; justify-content:center; font-size:13px; color:#fff;}
  .opt.sel{border-color:var(--brand); background:var(--brand-soft);}
  .opt.sel .box{background:var(--brand); border-color:var(--brand);}
  .opt.correct{border-color:var(--ok); background:var(--ok-soft);}
  .opt.correct .box{background:var(--ok); border-color:var(--ok);}
  .opt.wrong{border-color:var(--nope); background:var(--nope-soft);}
  .opt.wrong .box{background:var(--nope); border-color:var(--nope);}
  .opt.locked{pointer-events:none; opacity:.55;}
  .numrow{display:flex; gap:10px; align-items:center; margin-bottom:14px; justify-content:center;}
  .numin{font-family:var(--font); font-weight:800; font-size:20px; text-align:center; width:140px; padding:12px;
    border:2px solid var(--line); border-radius:12px; color:var(--ink); background:var(--card);}
  .numin:focus{outline:none; border-color:var(--brand);}
  .numunit{font-weight:700; color:var(--ink-soft); font-size:15px;}
  .fb{border-radius:13px; padding:14px 16px; font-weight:700; font-size:14.5px; margin-top:14px; line-height:1.5; display:none;}
  .fb.show{display:block; animation:pop .22s ease;}
  .fb.ok{background:var(--ok-soft); color:#1e6b40;}
  .fb.grit{background:var(--grit-soft); color:#9a5215;}
  .fb.no{background:var(--nope-soft); color:#9a2c22;}
  .fb .fbtitle{font-weight:900; display:block; margin-bottom:2px; font-size:15px;}
  @keyframes pop{from{transform:translateY(6px); opacity:0} to{transform:none; opacity:1}}
  .actionrow{display:flex; gap:10px; margin-top:16px;}
  .actionrow .cta{flex:1;}
  .we-step{border-left:3px solid var(--brand); padding:2px 0 2px 14px; margin:0 0 14px;}
  .we-step .we-q{font-weight:800; font-size:14px; color:var(--brand); margin:0 0 3px;}
  .we-step .we-a{font-weight:700; font-size:15px; margin:0;}
  .levelup{text-align:center; padding:10px 4px;}
  .beltbig{width:130px; height:26px; border-radius:8px; margin:6px auto 18px; border:2px solid rgba(0,0,0,.12); box-shadow:var(--shadow);}
  .confetti{font-size:40px; margin-bottom:4px;}
  .hint{background:var(--grit-soft); color:#8a4d16; border-radius:12px; padding:12px 15px; font-weight:700; font-size:14px; margin-bottom:14px; display:none;}
  .hint.show{display:block;}
  .hint b{font-weight:900;}
  .coachbtn{background:none; border:none; color:var(--brand); font-family:var(--font); font-weight:800; font-size:13.5px;
    cursor:pointer; padding:6px 0; display:inline-flex; align-items:center; gap:6px; margin-bottom:8px;}
  .coachbtn:hover{text-decoration:underline;}
  .coachbtn:disabled{color:var(--ink-faint); cursor:default; text-decoration:none;}
  .backlink{background:none;border:none;color:var(--ink-soft);font-family:var(--font);font-weight:800;font-size:14px;cursor:pointer;padding:0;margin-bottom:14px;display:inline-flex;gap:6px;align-items:center;}
  .backlink:hover{color:var(--ink)}
  .prow{display:flex; justify-content:space-between; align-items:center; padding:13px 0; border-bottom:1px solid var(--line-soft); font-weight:700; gap:12px;}
  .prow:last-child{border-bottom:none;}
  .prow .pl{color:var(--ink-soft); font-size:14px;}
  .prow .pv{font-weight:900; font-size:16px; text-align:right;}
  .tag{display:inline-block; font-size:12px; font-weight:800; padding:4px 10px; border-radius:999px; margin:3px 4px 0 0;}
  .tag.good{background:var(--ok-soft); color:#1e6b40;}
  .tag.grow{background:var(--brand-soft); color:var(--brand);}
  .tag.edge{background:var(--grit-soft); color:#9a5215;}
  .note{font-size:13px; color:var(--ink-soft); font-weight:600; margin-top:10px; line-height:1.55;}
  .micro{font-size:12.5px; color:var(--ink-faint); font-weight:700; margin-top:14px; text-align:center;}
  .skrow{display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--line-soft);}
  .skrow:last-child{border-bottom:none;}
  .skdot{width:14px;height:14px;border-radius:4px;border:1px solid rgba(0,0,0,.15);flex:none;}
  .skname{font-weight:800; font-size:14px;}
  .skmeta{font-size:12.5px; color:var(--ink-soft); font-weight:700;}
  .logo{text-shadow:0 1px 3px rgba(255,255,255,.55);}
  .ghostbtn{background:rgba(255,255,255,.72);}
  .themebtn{border:2px solid var(--line); border-radius:12px; height:52px; cursor:pointer; font-family:var(--font); font-weight:800; font-size:13px; color:#3a2e00;}
  .themebtn.sel{border-color:var(--brand); box-shadow:0 0 0 3px rgba(75,69,178,.16);}
  #fx{position:fixed; inset:0; pointer-events:none; z-index:9999; overflow:hidden;}
  .cft{position:absolute; top:-14px; width:10px; height:14px; border-radius:2px; opacity:.95; animation:cfall linear forwards;}
  @keyframes cfall{ to{ transform:translateY(106vh) rotate(720deg); opacity:.9; } }
  .sticker{position:fixed; left:50%; top:44%; transform:translate(-50%,-50%); text-align:center; animation:stpop .5s cubic-bezier(.2,1.3,.4,1) forwards;}
  .stEmoji{font-size:88px; line-height:1; filter:drop-shadow(0 4px 10px rgba(0,0,0,.25));}
  .stText{display:inline-block; margin-top:8px; font-weight:900; font-size:18px; color:#fff; background:rgba(30,30,40,.62); padding:6px 16px; border-radius:999px;}
  @keyframes stpop{ 0%{transform:translate(-50%,-50%) scale(.2); opacity:0} 60%{transform:translate(-50%,-53%) scale(1.15); opacity:1} 100%{transform:translate(-50%,-60%) scale(1); opacity:1} }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
/* ============================================================
   CONFIG
   ============================================================ */
const CONFIG = {
  PROXY_URL: 'https://script.google.com/macros/s/AKfycbylmWaNLR5Zu1-DzxfxH_FXLGN7Hh8jYCFvAqOKI4vxoyu25az7zvaQ2l3uyJi2m4-JQA/exec',
  APP_TOKEN: 'dojo-7Xq2m9Kp4Rt8vBn3',
  MODEL: 'claude-haiku-4-5-20251001',
  PARENT_PIN: '1234'   // ← 부모용 PIN. 꼭 바꾸세요. (소스에 보이므로 강한 잠금이 아니라, 실수 리셋·무단 접근 방지용 가벼운 게이트)
};
const COACH_ON = () => CONFIG.PROXY_URL && CONFIG.APP_TOKEN;

/* ---------------- storage ---------------- */
const _mem = {};
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v==null ? (_mem[k] ?? d) : JSON.parse(v);}catch(e){ return _mem[k] ?? d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){ _mem[k]=v; } }
};
const DEFAULT = { beltIndex:0, xp:0, gritBadges:0, attempts:0, correctFirstTry:0,
  stepsCleared:0, reasoningRight:0, calcSlips:0, beltsEarned:0, coachUses:0,
  skills:{}, wordStepMiss:[0,0,0,0,0], profile:{name:'',bday:''}, bg:{type:'none',value:''} };
let S = Object.assign({}, JSON.parse(JSON.stringify(DEFAULT)), store.get('mathdojo_number', {}));
if(!S.skills) S.skills={};
if(!S.wordStepMiss) S.wordStepMiss=[0,0,0,0,0];
if(!S.profile) S.profile={name:'',bday:''};
if(!S.bg) S.bg={type:'none',value:''};
function save(){ store.set('mathdojo_number', S); }

/* ---------------- personalization: background, birthday, celebrations ---------------- */
const THEMES = {
  dojang:'linear-gradient(135deg,#f3ead9,#e7d6bd)',
  ice:'linear-gradient(135deg,#e6f2fc,#cfe6f7)',
  sunset:'linear-gradient(135deg,#fde3d1,#f7c9c0)',
  mint:'linear-gradient(135deg,#dcf3e7,#c7ecd8)',
  grape:'linear-gradient(135deg,#ece9fb,#d6cff4)'
};
function applyBackground(){
  const b=S.bg||{type:'none'};
  const ov='linear-gradient(rgba(236,238,242,.46), rgba(236,238,242,.60))';
  if(b.type==='image' && b.value){ document.body.style.background=`${ov}, url("${b.value}") center center / cover fixed no-repeat`; }
  else if(b.type==='theme' && THEMES[b.value]){ document.body.style.background=THEMES[b.value]; document.body.style.backgroundAttachment='fixed'; }
  else { document.body.style.background='var(--paper)'; }
}
function firstName(){ return (S.profile && S.profile.name) ? S.profile.name.trim().split(/\s+/)[0] : ''; }
function isBirthday(){ const b=S.profile && S.profile.bday; if(!b || b.length<5) return false;
  const d=new Date(); const mmdd=String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); return b.slice(-5)===mmdd; }
let bdayShown=false;
function celebrate(kind){
  let fx=document.getElementById('fx'); if(!fx){ fx=document.createElement('div'); fx.id='fx'; document.body.appendChild(fx); }
  const colors=['#4b45b2','#f4c531','#e8873b','#2f9e5f','#3b7dd8','#d6483b'];
  const n = kind==='birthday'?90 : kind==='big'?60 : 26;
  for(let i=0;i<n;i++){ const p=document.createElement('div'); p.className='cft';
    p.style.left=(Math.random()*100)+'vw'; p.style.background=colors[Math.floor(Math.random()*colors.length)];
    p.style.animationDelay=(Math.random()*0.25)+'s'; p.style.animationDuration=(0.9+Math.random()*0.9)+'s';
    fx.appendChild(p); setTimeout(()=>p.remove(),2400); }
  const stickers = kind==='birthday'?['🎂','🎉','🥳','🎈']:['🎉','🥳','⭐','🔥','💪','🏆','🎊','👏'];
  const nm=firstName();
  const s=document.createElement('div'); s.className='sticker';
  const label = kind==='birthday' ? (nm?`Happy birthday, ${nm}!`:'Happy birthday!')
             : (kind==='big' ? (nm?`Belt earned, ${nm}!`:'Belt earned!')
             : (nm && Math.random()<0.5 ? `Nice, ${nm}!` : ''));
  s.innerHTML=`<div class="stEmoji">${stickers[Math.floor(Math.random()*stickers.length)]}</div>${label?`<div class="stText">${label}</div>`:''}`;
  fx.appendChild(s); setTimeout(()=>s.remove(), kind==='birthday'?2800:1500);
}

/* ---------------- adaptive engine ---------------- */
const LMAX = { int:5, frac:5, word:4, wsolve:4 };            // 최고 난이도 레벨
const GOAL = { int:5, frac:5, word:3 };            // 벨트 획득에 필요한 mastery
function skill(k){
  if(!S.skills[k]) S.skills[k]={ level:1, maxLevel:1, mastery:0, seen:0, clean:0, struggles:0, edge:0, streak:0, missRun:0 };
  return S.skills[k];
}
/* clean = 첫 시도 정답, 코치 안 씀 / struggled = 2회 이상 막힘 또는 코치 사용 */
function recordResult(k, clean, struggled){
  const sk=skill(k);
  sk.seen++;
  sk.mastery++;                         // 문제를 끝냈다 = 전진 (절대 후퇴 없음: 이 아이에게 중요)
  if(clean){
    sk.clean++; sk.streak=(sk.streak||0)+1; sk.missRun=0;
    if(sk.streak>=2 && sk.level<LMAX[k]){ sk.level++; sk.streak=0; }   // 잘하면 난이도 상승
    sk.maxLevel=Math.max(sk.maxLevel, sk.level);
  } else {
    sk.streak=0;
    if(struggled){
      sk.struggles++; sk.missRun=(sk.missRun||0)+1;
      sk.edge=Math.max(sk.edge||1, sk.level);       // 여기가 경계선 = 실제 수준
      if(sk.missRun>=2 && sk.level>1){ sk.level--; sk.missRun=0; }     // 막히면 한 단계 내려 발판 제공
    }
  }
  save();
}

/* ---------------- belts ---------------- */
const BELTS = [
  {key:'white',  name:'White belt',  color:'var(--belt-white)',  title:'Integer warm-up',            kind:'drill', skill:'int'},
  {key:'yellow', name:'Yellow belt', color:'var(--belt-yellow)', title:'Fractions and decimals',     kind:'drill', skill:'frac'},
  {key:'orange', name:'Orange belt', color:'var(--belt-orange)', title:'Word problems, step by step', kind:'word',  skill:'word'},
  {key:'green',  name:'Green belt',  color:'var(--belt-green)',  title:'Ratios and rates',           kind:'locked'},
  {key:'blue',   name:'Blue belt',   color:'var(--belt-blue)',   title:'Powers and roots',           kind:'locked'},
  {key:'red',    name:'Red belt',    color:'var(--belt-red)',    title:'Mixed challenge',            kind:'locked'},
  {key:'black',  name:'Black belt',  color:'var(--belt-black)',  title:'Number master',              kind:'locked'},
];
const beltColorText = c => (c==='var(--belt-yellow)'||c==='var(--belt-orange)')?'color:#4a3400':'';

/* ---------------- helpers ---------------- */
const pick = a => a[Math.floor(Math.random()*a.length)];
const cap  = s => s.charAt(0).toUpperCase()+s.slice(1);
const fmt  = n => n<0 ? `(${n})` : `${n}`;
const s1   = () => Math.random()<.5?-1:1;

/* ---------------- drill generators (by level) ---------------- */
function genItem(skillKey, level){
  if(skillKey==='int') return genInt(level);
  if(skillKey==='frac') return genFrac(level);
  if(skillKey==='wsolve') return genSolveDrill(level);
  return genInt(level);
}
/* isolated "solving step" practice — Joel's hardest move (rounding down after dividing) */
function genSolveDrill(level){
  const priceSet = level<=1?[10,12,15]: level===2?[15,18,20,25]: level===3?[24,28,35,45]:[36,44,52,65];
  const price=pick(priceSet), fee=pick(level<=2?[8,10,12]:[12,15,20]);
  const n=pick([3,4,5,6]);
  const remainder = level<=1?0:pick([1, Math.floor(price/2), price-1]);
  const budget=price*n+fee+remainder;
  const divExact=+((budget-fee)/price).toFixed(2);
  return { q:`${price}n + ${fee} ≤ ${budget}<br><span style="font-size:14px; color:var(--ink-soft); font-weight:700">biggest whole number n?</span>`,
    a:n,
    slips:[ {val:n+1, msg:`Recheck: ${price} × ${n+1} = ${price*(n+1)} — that's over once you add ${fee}. Round <b>down</b> to ${n}.`},
            ...(divExact!==n?[{val:divExact, msg:"Right idea — you divided correctly. Now round <b>down</b> to a whole number, since n has to be whole."}]:[]) ],
    hint:`Take ${budget} − ${fee} = ${budget-fee}. Divide by ${price}. Then round <b>down</b> to a whole number.` };
}
function genInt(level){
  if(level<=1){ const a=pick([3,4,5,6,7,8]), b=pick([2,3,4,5,6]); return {q:`${a} + ${b} =`, a:a+b}; }
  if(level===2){ const a=pick([5,7,9,11,13])*s1(), b=pick([2,4,6,8])*s1(); return {q:`${fmt(a)} + ${fmt(b)} =`, a:a+b}; }
  if(level===3){ const a=pick([6,8,10,12,15])*s1(), b=pick([3,5,7,9])*s1(); return {q:`${fmt(a)} − ${fmt(b)} =`, a:a-b}; }
  if(level===4){ const a=pick([3,4,5,6,7,8])*s1(), b=pick([2,3,4,5,6])*s1(); return {q:`${fmt(a)} × ${fmt(b)} =`, a:a*b}; }
  const b=pick([2,3,4,5,6]), q=pick([2,3,4,5,6,7,8]), sign=s1(); const a=b*q*sign; return {q:`${fmt(a)} ÷ ${fmt(b)} =`, a:a/b};
}
function genFrac(level){
  if(level<=1){ const p=pick([[1,2,0.5],[1,4,0.25],[3,4,0.75],[1,5,0.2],[2,5,0.4],[3,5,0.6],[1,10,0.1],[7,10,0.7]]); return {q:`Write ${p[0]}/${p[1]} as a decimal`, a:p[2]}; }
  if(level===2){ const a=pick([0.2,0.25,0.5,0.75,0.6]), b=pick([0.1,0.2,0.25,0.5]); return {q:`${a} + ${b} =`, a:+(a+b).toFixed(2)}; }
  if(level===3){ const p=pick([[1,2],[1,4],[3,4],[2,5],[3,5]]), whole=pick([12,20,24,40,60]); return {q:`${p[0]}/${p[1]} of ${whole} =`, a:+(whole*p[0]/p[1]).toFixed(2)}; }
  if(level===4){ const p=pick([[1,2,1,4,0.75],[1,4,1,5,0.45],[1,2,1,5,0.7],[3,4,1,5,0.95],[1,2,3,10,0.8]]); return {q:`${p[0]}/${p[1]} + ${p[2]}/${p[3]} =  (as a decimal)`, a:p[4]}; }
  const p=pick([[3,4,1,2,0.25],[4,5,1,2,0.3],[7,10,1,5,0.5],[3,5,1,4,0.35],[9,10,2,5,0.5]]); return {q:`${p[0]}/${p[1]} − ${p[2]}/${p[3]} =  (as a decimal)`, a:p[4]};
}

const WORKED = {
  scenario:"Worked example: A bakery sells muffins for $3 each. A box costs $2. Maria has $20. How many muffins fit her budget if she buys one box?",
  steps:[
    {q:"1. What is being asked?", a:"How many muffins Maria can afford."},
    {q:"2. Useful numbers?", a:"$3 per muffin, $2 box, $20 total."},
    {q:"3. Words → equation", a:"3 × (muffins) + 2 ≤ 20"},
    {q:"4. Solve, then check", a:"3m ≤ 18, so m ≤ 6. Check: 3×6 + 2 = 20. ✓ Answer: 6 muffins."},
  ]
};
const STEP_NAMES = ['finding the question','picking the useful numbers','building the equation','solving','checking'];

/* ---------------- word problem generator (by level) ---------------- */
const WORD_TEMPLATES = [
  {item:'hockey sticks', unit:'stick', fee:'shipping',   verb:'buy', trap:d=>`${d} km away`,      trapText:'how far away the store is'},
  {item:'concert tickets',unit:'ticket',fee:'booking fee',verb:'buy', trap:d=>`${d} minutes away`, trapText:'how long the drive is'},
  {item:'notebooks',     unit:'notebook',fee:'delivery',  verb:'get', trap:d=>`${d} pages each`,    trapText:'how many pages each has'},
];
const NAMES = ['Jordan','Maya','Alex','Sam','Priya','Noah','Leo','Zoe'];
function genWord(level){
  const t=pick(WORD_TEMPLATES), name=pick(NAMES);
  const priceSet = level<=1?[10,12,15]: level===2?[15,18,20,25]: level===3?[24,28,35,45]:[36,44,52,65];
  const price=pick(priceSet), fee=pick(level<=2?[8,10,12]:[12,15,20]);
  const n=pick([3,4,5,6]);
  const remainder = level<=1 ? 0 : pick([1, Math.floor(price/2), price-1]); // L1은 딱 떨어짐(반올림 X)
  const budget=price*n+fee+remainder, trapNum=pick([5,6,7,8,9,10,12]);
  const divExact=+((budget-fee)/price).toFixed(2);
  const scenario=`A store sells <b>${t.item}</b> for <b>$${price}</b> each. ${cap(t.fee)} is <b>$${fee}</b> total, no matter how many you buy. `+
    `${name} has <b>$${budget}</b>. The store is <b>${t.trap(trapNum)}</b>. How many ${t.item} can ${name} ${t.verb}?`;
  const steps=[
    { chip:'Ask', type:'choice', prompt:'Step 1 — What is the problem actually asking?',
      options:[
        {t:`How much the ${t.fee} costs`, ok:false, fb:"That's a number in the problem, but not the goal. Read the last sentence again."},
        {t:`How many ${t.item} ${name} can ${t.verb}`, ok:true, fb:"Yes — it's a 'how many' question, so the answer is a whole number."},
        {t:`Basically, ${t.trapText}`, ok:false, fb:"That detail is in there, but the question isn't about it. Check the last sentence."},
      ], hint:"Look only at the <b>last sentence</b>. What does it ask for?" },
    { chip:'Find', type:'multi', prompt:'Step 2 — Which numbers do you actually need? Pick all that help. Leave out any trap.',
      options:[ {t:`$${price} per ${t.unit}`, ok:true},{t:`$${fee} ${t.fee}`, ok:true},{t:`$${budget} ${name} has`, ok:true},{t:`${t.trap(trapNum)}`, ok:false} ],
      correctSet:[0,1,2],
      okFb:"Exactly. That last one is a <b>trap number</b> — true, but useless here. Spotting traps is a real skill.",
      noFb:"Close. One number has nothing to do with money. Which one?",
      hint:"You're spending money. Which number is <b>not about money</b>?" },
    { chip:'Build', type:'choice', prompt:`Step 3 — Turn the words into an equation. (n = number of ${t.item})`,
      options:[
        {t:`${price} + ${fee} + n ≤ ${budget}`, ok:false, fb:`The $${price} is for <i>each</i> ${t.unit}, so it multiplies by n.`},
        {t:`${price}n + ${fee} ≤ ${budget}`, ok:true, fb:`That's it. $${price} per item, plus the one-time $${fee}, stays within $${budget}.`},
        {t:`${price}n + ${fee}n ≤ ${budget}`, ok:false, fb:`The $${fee} is charged <i>once</i>, not per item — it shouldn't multiply by n.`},
      ], hint:`Cost = ($${price} × items) + ($${fee} once). Keep it <b>at or under</b> $${budget}.` },
    { chip:'Solve', type:'num', answer:n, unit:t.unit+'s', prompt:`Step 4 — Solve ${price}n + ${fee} ≤ ${budget}. How many ${t.item} can ${name} ${t.verb}?`,
      slips:[ ...(divExact!==n?[{val:divExact, msg:"Your setup and thinking are spot on. But you can't buy part of one — round <b>down</b> to a whole number."}]:[]),
              {val:n+1, msg:`Your equation was right — nice reasoning. Just recheck: ${price} × ${n+1} = ${price*(n+1)}, already over budget once you add ${fee}. Try ${n}.`} ],
      hint:`Subtract ${fee} from ${budget} first (that's ${budget-fee}). Then divide by ${price}. Then round <b>down</b>.` },
    { chip:'Check', type:'num', answer:price*n+fee, unit:'dollars', prompt:`Step 5 — Does ${n} make sense? What does ${price} × ${n} + ${fee} equal?`,
      slips:[], hint:`Multiply ${price} × ${n}, then add the ${fee}.` },
  ];
  return { scenario, steps };
}

/* ---------------- Claude coach ---------------- */
async function claudeCall_(system, userText, maxTokens){
  const res=await fetch(CONFIG.PROXY_URL, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify({ token:CONFIG.APP_TOKEN, model:CONFIG.MODEL, max_tokens:maxTokens||300, system, messages:[{role:'user',content:userText}] })});
  const data=await res.json();
  if(data.error) throw new Error(typeof data.error==='string'?data.error:JSON.stringify(data.error));
  return (data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n').trim();
}
const COACH_SYSTEM =
  "You are a warm, patient math coach for a 14-year-old in grade 9. He has a learning disability: strong at step-by-step "+
  "procedures but finds multi-step reasoning hard, and he gets frustrated and quits when stuck. Give exactly ONE short hint, "+
  "max 2 sentences, simple friendly English. Never give the final answer or do the whole step — just nudge the single next move. "+
  "Be encouraging; never say the problem is easy.";
async function coachHint(contextText, hintBoxId, btn){
  S.coachUses++; if(RUN) RUN.coach=true; save();
  const box=document.getElementById(hintBoxId);
  if(!COACH_ON()){ if(box) box.classList.add('show'); return; }
  if(btn){ btn.disabled=true; btn.textContent='Coach is thinking…'; }
  try{ const hint=await claudeCall_(COACH_SYSTEM, contextText, 200); if(box){ box.innerHTML=hint; box.classList.add('show'); } }
  catch(e){ if(box) box.classList.add('show'); }
  finally{ if(btn){ btn.disabled=false; btn.textContent='Ask the coach for another hint'; } }
}

function weakestSkill(){
  const cands=[['word','Word problems'],['wsolve','Solving step'],['frac','Fractions & decimals'],['int','Integers']];
  let best=null, worst=1e9;
  cands.forEach(([k])=>{ const sk=S.skills[k]; if(!sk) return;
    const score = sk.level*10 - (sk.struggles||0)*3;  // 낮을수록 약함
    if(sk.seen>0 && score<worst){ worst=score; best=k; }
  });
  // word problems에서 특정 단계가 많이 막히면 그 단계(solving)를 우선
  const m=S.wordStepMiss||[]; const maxMiss=Math.max(...m,0);
  if(maxMiss>=3 && m.indexOf(maxMiss)===3) return 'wsolve';
  return best || 'word';
}

  if(pos>=0){ wordState.sel.splice(pos,1); opt.classList.remove('sel'); } else { wordState.sel.push(i); opt.classList.add('sel'); }
}
function checkMulti(){
  if(wordState.done) return;
  const step=VIEW._w.steps[VIEW.step];
  const want=step.correctSet.slice().sort().join(','), got=wordState.sel.slice().sort().join(',');
  S.attempts++; const fb=document.getElementById('wFb');
  if(want===got){
    if(wordState.tries===0){ S.correctFirstTry++; S.reasoningRight++; }
    document.querySelectorAll('#opts .opt').forEach((o,i)=>{ o.classList.add('locked'); if(step.correctSet.includes(i)) o.classList.add('correct'); });
    document.getElementById('multiBtn').style.display='none';
    wordState.done=true; S.stepsCleared++;
    const g=wordState.tries>0; if(g){ S.gritBadges++; RUN.stumbles++; } S.xp+=8; save();
    afterStepClearedUI(step.okFb, g?'grit':'ok');
  } else {
    wordState.tries++; noteStepMiss(); save(); fb.className='fb no show';
    fb.innerHTML=`<span class="fbtitle">Almost — adjust your picks</span>${step.noFb}`;
    if(wordState.tries>=2) document.getElementById('wHint').classList.add('show');
  }
}
function checkNum(){
  if(wordState.done) return;
  const step=VIEW._w.steps[VIEW.step];
  const raw=document.getElementById('wnum').value.trim(); if(raw==='') return;
  const val=parseFloat(raw), fb=document.getElementById('wFb'); S.attempts++;
  if(Math.abs(val-step.answer)<1e-6){
    if(wordState.tries===0){ S.correctFirstTry++; S.reasoningRight++; }
    wordState.done=true; S.stepsCleared++;
    const g=wordState.tries>0; if(g){ S.gritBadges++; RUN.stumbles++; } S.xp+=8; save();
    document.getElementById('wnum').setAttribute('disabled',''); document.getElementById('numBtn').style.display='none';
    afterStepClearedUI("Correct — and you checked it yourself. That's exactly how a black belt works.", g?'grit':'ok');
    return;
  }
  const slip=(step.slips||[]).find(s=>Math.abs(val-s.val)<1e-6);
  wordState.tries++; noteStepMiss();
  if(slip){ S.calcSlips++; S.reasoningRight++; save(); fb.className='fb grit show'; fb.innerHTML=`<span class="fbtitle">Your thinking was right</span>${slip.msg}`; }
  else { save(); fb.className='fb no show'; fb.innerHTML=`<span class="fbtitle">Not yet — no rush</span>Work it out on paper if it helps, then try again.`;
    if(wordState.tries>=2) document.getElementById('wHint').classList.add('show'); }
}

function checkSharpen(){
  const sk=VIEW.skill, s=skill(sk);
  const raw=document.getElementById('shIn').value.trim(); if(raw==='') return;
  const val=parseFloat(raw), fb=document.getElementById('shFb'), btn=document.getElementById('shBtn');

    const clean=SHARP.tries===0; if(clean) S.correctFirstTry++;
    S.xp+=5;
    const before=s.level, struggled=SHARP.tries>=2;

    const slip=(CUR.slips||[]).find(x=>Math.abs(val-x.val)<1e-6);
    SHARP.tries++;
    if(slip){ S.calcSlips++; S.reasoningRight++; save(); fb.className='fb grit show'; fb.innerHTML=`<span class="fbtitle">Your thinking was right</span>${slip.msg}`; }
    else { save(); fb.className='fb no show';
      if(SHARP.tries>=2){ fb.innerHTML=`<span class="fbtitle">Not yet — take your time</span>Work it out on paper, then try again.`; document.getElementById('shHint').classList.add('show'); }
      else fb.innerHTML=`<span class="fbtitle">Close — try once more</span>Slow it down a step.`; }
  }
}
function nextSharpen(){ const sk=VIEW.skill; SHARP={skill:sk, tries:0}; CUR=genItem(sk, skill(sk).level); go({name:'sharpen', skill:sk}); }

/* ---------------- render ---------------- */
function render(){
  applyBackground();
  let html='';
  switch(VIEW.name){
    case 'home': html=renderHome(); break;
    case 'drill': html=renderDrill(); break;
    case 'word-intro': html=renderWordIntro(); break;
    case 'word': html=renderWord(); break;
    case 'word-next': html=renderWordNext(); break;
    case 'levelup': html=renderLevelUp(); break;
    case 'parent': html=renderParent(); break;
    case 'customize': html=renderCustomize(); break;
    case 'sharpen-pick': html=renderSharpenPick(); break;
    case 'sharpen': html=renderSharpen(); break;
    default: html=renderHome();
  }
  app.innerHTML=html;
  const di=document.getElementById('drillIn'); if(di){ di.focus(); di.addEventListener('keydown',e=>{if(e.key==='Enter')checkDrill();}); }
  const sh=document.getElementById('shIn'); if(sh){ sh.focus(); sh.addEventListener('keydown',e=>{if(e.key==='Enter')checkSharpen();}); }
  const wn=document.getElementById('wnum'); if(wn){ wn.focus(); wn.addEventListener('keydown',e=>{if(e.key==='Enter')checkNum();}); }
  const pn=document.getElementById('pinIn'); if(pn){ pn.focus(); pn.addEventListener('keydown',e=>{if(e.key==='Enter')tryPin();}); }
}
render();
</script>
