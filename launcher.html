<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Asung Tools">
<meta name="theme-color" content="#080a0f">
<title>Asung Tools</title>
<style>
* { -webkit-box-sizing: border-box; box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; background: #080a0f; color: #f1f5f9; }
body {
  font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;
  min-height: 100%; display: flex; flex-direction: column;
  align-items: center; justify-content: flex-start; padding: 40px 24px;
}
.logo-wrap { text-align: center; margin-bottom: 36px; }
.logo-img { display:block; height: 48px; width:auto; margin: 0 auto; }
.logo { font-size: 34px; font-weight: 900; letter-spacing: -1px; color: #3b82f6; }
.logo-sub { font-size: 11px; letter-spacing: 4px; text-transform: uppercase; color: #475569; margin-top: 6px; }

.menu { width: 100%; max-width: 420px; }

.cat { margin-bottom: 22px; }
.cat-label {
  font-size: 11px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase;
  color: #64748b; margin: 0 4px 10px; display: flex; align-items: center; gap: 10px;
}
.cat-label::after { content: ""; flex: 1; height: 1px; background: #1a202c; }

.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.tile {
  display: flex; flex-direction: column;
  background: #0f1218; border: 1px solid #222a38; border-radius: 12px;
  padding: 14px; text-decoration: none; color: #f1f5f9; cursor: pointer;
}
.tile:active { background: #161b24; border-color: #2a3446; }

.icon {
  width: 40px; height: 40px; border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px; margin-bottom: 10px; flex-shrink: 0;
}
.icon-red    { background: #2a1010; }
.icon-orange { background: #2a1a00; }
.icon-blue   { background: #0f1e38; }
.icon-green  { background: #0a2010; }
.icon-purple { background: #1a0f2a; }
.icon-yellow { background: #1a1500; }
.icon-teal   { background: #06231f; }
.icon-cyan   { background: #06222a; }
.icon-pink   { background: #2a0f1e; }

.tile-name { font-size: 14px; font-weight: 600; line-height: 1.25; }
.tile-desc { font-size: 10.5px; color: #475569; margin-top: 4px; line-height: 1.3; }

.footer { margin-top: 20px; margin-bottom: 8px; font-size: 11px; color: #2a3446; letter-spacing: 1px; text-align: center; }
</style>
</head>
<body>

<div class="logo-wrap">
  <img class="logo-img" src="asung-logo-white.png" alt="Asung Trading Inc.">
  <div class="logo-sub">Tools</div>
</div>

<div class="menu">

  <!-- 발주 & 주문 -->
  <div class="cat">
    <div class="cat-label">발주 &amp; 주문</div>
    <div class="grid">

      <a class="tile" href="https://asungtrading.github.io/tools/purchasing.html">
        <div class="icon icon-orange">📦</div>
        <div class="tile-name">발주 관리</div>
        <div class="tile-desc">Supplier별 추천발주 · Forecast</div>
      </a>

      <a class="tile" href="https://tools.asung.ca/tradeshow.html">
        <div class="icon icon-pink">🎪</div>
        <div class="tile-name">트레이드쇼</div>
        <div class="tile-desc">전시회 주문</div>
      </a>

      <a class="tile" href="https://asungtrading.github.io/tools/analytics.html">
        <div class="icon icon-purple">🔍</div>
        <div class="tile-name">Historical Data</div>
        <div class="tile-desc">2022년부터 전체 매출 분석</div>
      </a>

    </div>
  </div>

  <!-- 창고 & 물류 -->
  <div class="cat">
    <div class="cat-label">창고 &amp; 물류</div>
    <div class="grid">

      <a class="tile" href="https://wms.asung.ca">
        <div class="icon icon-teal">🏭</div>
        <div class="tile-name">Asung WMS</div>
        <div class="tile-desc">픽 · 팩 작업 관리</div>
      </a>

      <a class="tile" href="https://tools.asung.ca/warehousemap.html">
        <div class="icon icon-green">🗺️</div>
        <div class="tile-name">창고 맵</div>
        <div class="tile-desc">존/랙 · 제품 위치 검색</div>
      </a>

      <a class="tile" href="https://asungtrading.github.io/tools/barcode-generator.html">
        <div class="icon icon-yellow">🏷️</div>
        <div class="tile-name">바코드 생성기</div>
        <div class="tile-desc">UPC · GTIN-14 발급</div>
      </a>

    </div>
  </div>

  <!-- 고객 & 영업 -->
  <div class="cat">
    <div class="cat-label">고객 &amp; 영업</div>
    <div class="grid">

      <a class="tile" href="https://tools.asung.ca/customer-portal.html">
        <div class="icon icon-blue">👤</div>
        <div class="tile-name">고객 포털</div>
        <div class="tile-desc">손님용 구매 데이터 · 가격표</div>
      </a>

      <a class="tile" href="https://asungtrading.github.io/tools/OpenOrders.html">
        <div class="icon icon-blue">📋</div>
        <div class="tile-name">데일리 오픈 오더</div>
        <div class="tile-desc">오늘의 미처리 오더</div>
      </a>

      <a class="tile" href="https://tools.asung.ca/visitor-analytics.html">
        <div class="icon icon-cyan">👣</div>
        <div class="tile-name">asung.ca 방문 분석</div>
        <div class="tile-desc">손님 방문 · 상품 조회 추적</div>
      </a>

    </div>
  </div>

</div>

<div class="footer">ASUNG TRADING INC.</div>

</body>
</html>
