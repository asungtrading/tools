<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asung — My Account</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
/* ══════════════════════════════════════
   DESIGN TOKENS — same palette as internal apps
   ══════════════════════════════════════ */
:root {
  --bg:       #080a0f;
  --surface:  #0f1218;
  --surface2: #161b24;
  --surface3: #1c2330;
  --border:   #222a38;
  --border2:  #2a3446;
  --blue:     #3b82f6;
  --blue2:    #60a5fa;
  --green:    #22c55e;
  --red:      #ef4444;
  --yellow:   #eab308;
  --orange:   #f97316;
  --purple:   #a855f7;
  --teal:     #14b8a6;
  --text:     #f1f5f9;
  --mid:      #94a3b8;
  --dim:      #475569;
  --gold:     #f59e0b;
  --grid:     #1a2233;
}
*  { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'DM Sans', 'Segoe UI', sans-serif;
  font-size: 13px;
  min-height: 100vh;
}
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background: radial-gradient(ellipse 80% 50% at 50% -20%, rgba(59,130,246,.07), transparent);
  pointer-events: none;
  z-index: 0;
}

/* ── LOGIN ── */
#loginScreen {
  position: fixed; inset: 0; background: var(--bg); z-index: 9999;
  display: flex; align-items: center; justify-content: center;
}
.login-wrap { display: flex; flex-direction: column; align-items: center; gap: 28px; width: 100%; max-width: 400px; padding: 20px; }
.login-logo-mark {
  font-size: 42px; font-weight: 900; letter-spacing: -2px;
  background: linear-gradient(135deg, var(--blue), var(--teal));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.login-logo-sub { font-size: 11px; letter-spacing: 4px; text-transform: uppercase; color: var(--dim); margin-top: 2px; text-align: center; }
.login-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 16px; padding: 36px 40px; width: 100%;
}
.login-title { font-size: 18px; font-weight: 700; margin-bottom: 6px; }
.login-sub   { font-size: 12px; color: var(--dim); margin-bottom: 28px; line-height: 1.6; }
.field-group  { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
.field-label  { font-size: 11px; color: var(--mid); letter-spacing: .5px; text-transform: uppercase; }
.field-input  {
  background: var(--surface2); border: 1px solid var(--border2);
  color: var(--text); border-radius: 8px; padding: 10px 14px;
  font-size: 13px; width: 100%; outline: none; font-family: inherit;
  transition: border-color .2s;
}
.field-input:focus { border-color: var(--blue); }
.login-btn {
  width: 100%; background: var(--blue); color: #fff; border: none;
  border-radius: 10px; padding: 13px; font-size: 14px; font-weight: 600;
  cursor: pointer; transition: all .2s; margin-top: 8px;
}
.login-btn:hover   { background: var(--blue2); transform: translateY(-1px); box-shadow: 0 8px 24px rgba(59,130,246,.3); }
.login-btn:active  { transform: translateY(0); }
.login-btn:disabled { opacity: .5; cursor: default; transform: none; }
.login-err { color: var(--red); font-size: 12px; margin-top: 12px; min-height: 16px; text-align: center; }
.login-note { font-size: 11px; color: var(--dim); text-align: center; }

/* ── MAIN APP ── */
#mainApp { display: none; position: relative; z-index: 1; }

/* ── HEADER ── */
.hdr {
  background: rgba(8,10,15,.92); backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border);
  padding: 0 24px; display: flex; align-items: center;
  justify-content: space-between; height: 56px;
  position: sticky; top: 0; z-index: 100;
}
.hdr-brand  { display: flex; align-items: center; gap: 10px; }
.hdr-logo   { font-size: 16px; font-weight: 800; letter-spacing: -.5px; background: linear-gradient(135deg, var(--blue), var(--teal)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.hdr-sep    { color: var(--border2); font-size: 18px; }
.hdr-title  { font-size: 13px; color: var(--mid); font-weight: 500; }
.hdr-right  { display: flex; align-items: center; gap: 12px; }
.hdr-cust   { font-size: 12px; color: var(--mid); }
.hdr-cust strong { color: var(--text); }
.hdr-signout {
  font-size: 11px; color: var(--dim); cursor: pointer;
  padding: 4px 10px; border: 1px solid var(--border);
  border-radius: 6px; transition: all .2s; background: none;
}
.hdr-signout:hover { color: var(--text); border-color: var(--border2); }

/* ── TAB NAV ── */
.tab-nav {
  display: flex; align-items: center; gap: 4px;
  padding: 0 24px; background: var(--surface);
  border-bottom: 1px solid var(--border);
  overflow-x: auto; -webkit-overflow-scrolling: touch;
}
.tab-btn {
  padding: 14px 16px; font-size: 12px; font-weight: 500;
  color: var(--dim); background: none; border: none;
  border-bottom: 2px solid transparent; cursor: pointer;
  white-space: nowrap; transition: all .15s;
}
.tab-btn:hover  { color: var(--mid); }
.tab-btn.active { color: var(--text); border-bottom-color: var(--blue); }

/* ── DATE FILTER BAR ── */
.filter-bar {
  background: var(--surface); border-bottom: 1px solid var(--border);
  padding: 10px 24px; display: flex; align-items: center;
  gap: 12px; flex-wrap: wrap;
}
.filter-label { font-size: 11px; color: var(--dim); white-space: nowrap; }
.filter-input {
  background: var(--surface2); border: 1px solid var(--border2);
  color: var(--text); border-radius: 6px; padding: 6px 10px;
  font-size: 12px; outline: none; font-family: inherit;
  transition: border-color .2s;
}
.filter-input:focus { border-color: var(--blue); }
.filter-btn {
  background: var(--blue); color: #fff; border: none;
  border-radius: 6px; padding: 6px 14px; font-size: 12px;
  font-weight: 600; cursor: pointer; transition: all .15s;
  white-space: nowrap;
}
.filter-btn:hover   { background: var(--blue2); }
.filter-btn.ghost   { background: none; border: 1px solid var(--border2); color: var(--mid); }
.filter-btn.ghost:hover { border-color: var(--blue); color: var(--text); }
.filter-sep { color: var(--border2); }
.quick-btns { display: flex; gap: 4px; }
.q-btn {
  font-size: 11px; padding: 4px 8px; background: var(--surface2);
  border: 1px solid var(--border); color: var(--dim);
  border-radius: 4px; cursor: pointer; transition: all .15s;
}
.q-btn:hover, .q-btn.active { background: var(--surface3); border-color: var(--blue2); color: var(--text); }

/* ── CONTENT ── */
.tab-panel { display: none; padding: 24px; }
.tab-panel.active { display: block; }

/* ── KPI STRIP ── */
.kpi-strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 20px; }
.kpi {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; padding: 16px 18px;
  border-left: 3px solid transparent;
}
.kpi.blue   { border-left-color: var(--blue); }
.kpi.green  { border-left-color: var(--green); }
.kpi.yellow { border-left-color: var(--yellow); }
.kpi.purple { border-left-color: var(--purple); }
.kpi.teal   { border-left-color: var(--teal); }
.kpi.orange { border-left-color: var(--orange); }
.kpi-lbl { font-size: 10px; text-transform: uppercase; letter-spacing: .8px; color: var(--dim); margin-bottom: 6px; }
.kpi-val { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
.kpi-sub { font-size: 11px; color: var(--dim); margin-top: 4px; }

/* ── CHARTS ── */
.charts-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; margin-bottom: 16px; }
.charts-row  { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; margin-bottom: 16px; }
.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; padding: 18px;
}
.card-hdr   { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.card-title { font-size: 12px; font-weight: 600; color: var(--text); }
.card-badge { font-size: 10px; background: var(--surface3); border: 1px solid var(--border2); border-radius: 4px; padding: 2px 6px; color: var(--dim); }
.chart-box      { height: 200px; }
.chart-box.tall { height: 240px; }

/* ── BENCHMARK PILL ── */
.bench-same   { color: var(--dim);   font-size: 10px; }

/* ── TABLES ── */
.tbl-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; overflow: hidden; margin-bottom: 16px;
}
.tbl-hdr {
  padding: 14px 18px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
}
.tbl-title { font-size: 12px; font-weight: 600; }
.tbl-count { font-size: 11px; color: var(--dim); }
.tbl-wrap  { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th {
  padding: 8px 12px; text-align: left; font-size: 10px;
  font-weight: 600; text-transform: uppercase; letter-spacing: .6px;
  color: var(--dim); background: var(--surface2);
  border-bottom: 1px solid var(--border); white-space: nowrap;
}
th.num, td.num { text-align: right; }
td {
  padding: 8px 12px; font-size: 12px; border-bottom: 1px solid var(--border);
  white-space: nowrap;
}
tr:last-child td { border-bottom: none; }
tr:hover td { background: var(--surface2); }
.sku-tag { font-family: monospace; font-size: 11px; color: var(--blue2); }
.brand-tag { color: var(--mid); font-size: 11px; }
.loc-tor { color: var(--blue2); }
.loc-edm { color: var(--orange); }

/* ── SKU DETAIL DRAWER ── */
.sku-drawer {
  position: fixed; right: 0; top: 0; bottom: 0; width: 480px;
  background: var(--surface); border-left: 1px solid var(--border);
  z-index: 500; overflow-y: auto; transform: translateX(100%);
  transition: transform .25s ease; padding: 24px;
}
.sku-drawer.open { transform: translateX(0); }
.drawer-close {
  float: right; background: none; border: none;
  color: var(--mid); cursor: pointer; font-size: 18px;
  padding: 4px 8px; margin-top: -4px;
}
.drawer-close:hover { color: var(--text); }
.drawer-title { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
.drawer-sku   { font-family: monospace; font-size: 12px; color: var(--blue2); margin-bottom: 20px; }
.bench-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
.bench-card {
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 8px; padding: 12px 14px;
}
.bench-lbl { font-size: 10px; text-transform: uppercase; letter-spacing: .6px; color: var(--dim); margin-bottom: 4px; }
.bench-val { font-size: 18px; font-weight: 700; }
.bench-val.up   { color: var(--red); }
.bench-val.down { color: var(--green); }
.bench-sub { font-size: 10px; color: var(--dim); margin-top: 2px; }
.drawer-chart-box { height: 180px; margin-bottom: 20px; }

/* ── SEARCH BAR ── */
.search-row { display: flex; gap: 8px; margin-bottom: 16px; align-items: center; flex-wrap: wrap; }
.search-input {
  flex: 1; min-width: 200px; background: var(--surface2);
  border: 1px solid var(--border2); color: var(--text);
  border-radius: 8px; padding: 8px 12px; font-size: 12px;
  outline: none; font-family: inherit; transition: border-color .2s;
}
.search-input:focus { border-color: var(--blue); }
.search-select {
  background: var(--surface2); border: 1px solid var(--border2);
  color: var(--mid); border-radius: 8px; padding: 8px 10px;
  font-size: 12px; outline: none; cursor: pointer;
}

/* ── STATES ── */
.loading { display: flex; align-items: center; justify-content: center; gap: 12px; padding: 60px 20px; color: var(--dim); }
.spinner {
  width: 20px; height: 20px; border: 2px solid var(--border2);
  border-top-color: var(--blue); border-radius: 50%;
  animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.empty-state { text-align: center; padding: 60px 20px; }
.empty-icon  { font-size: 36px; margin-bottom: 12px; }
.empty-title { font-size: 15px; font-weight: 600; margin-bottom: 6px; }
.empty-desc  { font-size: 12px; color: var(--dim); }
.export-btn {
  font-size: 11px; padding: 4px 10px; background: var(--surface2);
  border: 1px solid var(--border2); color: var(--mid);
  border-radius: 5px; cursor: pointer; transition: all .15s;
}
.export-btn:hover { border-color: var(--blue); color: var(--text); }

/* ── STORE SELECTOR ── */
.store-select {
  background: var(--surface2); border: 1px solid var(--border2);
  color: var(--text); border-radius: 8px; padding: 5px 10px;
  font-size: 12px; font-weight: 500; outline: none; cursor: pointer;
  max-width: 220px; transition: border-color .2s;
}
.store-select:focus { border-color: var(--blue); }

/* ── ORDER SEARCH INPUTS ── */
.orders-search { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }

/* ── RESPONSIVE ── */
@media (max-width: 768px) {
  .hdr          { padding: 0 12px; }
  .hdr-title    { display: none; }
  .hdr-sep      { display: none; }
  .tab-panel    { padding: 12px; }
  .filter-bar   { padding: 8px 12px; }
  .charts-grid  { grid-template-columns: 1fr; }
  .kpi-strip    { grid-template-columns: repeat(2, 1fr); }
  .sku-drawer   { width: 100%; }
}
</style>
</head>
<body>

<!-- ══════════════════════════════════════
     LOGIN SCREEN
     ══════════════════════════════════════ -->
<div id="loginScreen">
  <div class="login-wrap">
    <div>
      <div class="login-logo-mark">ASUNG</div>
      <div class="login-logo-sub">Customer Portal</div>
    </div>
    <div class="login-card">
      <div class="login-title">Sign in to your account</div>
      <div class="login-sub">Access your purchase history, trends, and insights from Asung Trading.</div>
      <div class="field-group" id="idFieldGroup">
        <div class="field-label">Customer ID</div>
        <input class="field-input" id="loginId" type="text" placeholder="e.g. G001" autocomplete="username" />
      </div>
      <div class="field-group">
        <div class="field-label">Password</div>
        <input class="field-input" id="loginPw" type="password" placeholder="Your portal password" autocomplete="current-password"
          onkeydown="if(event.key==='Enter')doLogin()" />
      </div>
      <button class="login-btn" id="loginBtn" onclick="doLogin()">Sign In</button>
      <div class="login-err" id="loginErr"></div>
    </div>
    <div class="login-note">Need access? Contact your Asung representative.</div>
  </div>
</div>

<!-- ══════════════════════════════════════
     MAIN APP
     ══════════════════════════════════════ -->
<div id="mainApp">

  <!-- Header -->
  <div class="hdr">
    <div class="hdr-brand">
      <span class="hdr-logo">ASUNG</span>
      <span class="hdr-sep">|</span>
      <span class="hdr-title">My Account</span>
    </div>
    <div class="hdr-right">
      <div id="storeSelectorWrap" style="display:none;align-items:center;gap:8px">
        <span style="font-size:11px;color:var(--dim)">Viewing:</span>
        <select id="storeSelector" class="store-select" onchange="onStoreChange()"></select>
      </div>
      <span class="hdr-sep" style="color:var(--border2)">|</span>
      <span class="hdr-cust">Signed in as <strong id="custName">—</strong></span>
      <button class="hdr-signout" onclick="doLogout()">Sign out</button>
    </div>
  </div>

  <!-- Tab nav -->
  <div class="tab-nav">
    <button class="tab-btn active" onclick="switchTab('overview')">📊 Overview</button>
    <button class="tab-btn" onclick="switchTab('reco')">🌟 Buy More / Reorder</button>
    <button class="tab-btn" onclick="switchTab('skus')">📦 My Products</button>
    <button class="tab-btn" onclick="switchTab('orders')">🧾 Order History</button>
  </div>

  <!-- Filter bar -->
  <div class="filter-bar">
    <span class="filter-label">Period</span>
    <input class="filter-input" id="dateFrom" type="date" />
    <span class="filter-sep">—</span>
    <input class="filter-input" id="dateTo"   type="date" />
    <div class="quick-btns">
      <button class="q-btn" onclick="setQuick(3)">3M</button>
      <button class="q-btn" onclick="setQuick(6)">6M</button>
      <button class="q-btn" onclick="setQuick(12)">1Y</button>
      <button class="q-btn" onclick="setQuick(0)">All</button>
    </div>
    <button class="filter-btn" onclick="applyFilters()">Apply</button>
  </div>

  <!-- Tab: Overview -->
  <div class="tab-panel active" id="tab-overview">
    <div id="overviewContent"><div class="loading"><div class="spinner"></div> Loading your data…</div></div>
  </div>

  <!-- Tab: Recommendations -->
  <div class="tab-panel" id="tab-reco">
    <div id="recoContent"><div class="loading"><div class="spinner"></div> Loading…</div></div>
  </div>

  <!-- Tab: SKUs -->
  <div class="tab-panel" id="tab-skus">
    <div class="search-row">
      <input class="search-input" id="skuSearch" placeholder="Search SKU or product name…" oninput="filterSkuTable()" />
      <select class="search-select" id="brandFilter" onchange="filterSkuTable()">
        <option value="">All Brands</option>
      </select>
      <span id="skuCountLabel" style="font-size:11px;color:var(--dim);white-space:nowrap"></span>
    </div>
    <div id="skusContent"><div class="loading"><div class="spinner"></div> Loading…</div></div>
  </div>

  <!-- Tab: Orders -->
  <div class="tab-panel" id="tab-orders">
    <div class="orders-search">
      <input class="search-input" id="orderNumSearch" placeholder="Filter by order #…" oninput="filterOrderTable()" style="max-width:160px" />
      <input class="search-input" id="orderSkuSearch" placeholder="Filter by SKU or product…" oninput="filterOrderTable()" style="max-width:240px" />
      <input class="search-input" id="orderBrandSearch" placeholder="Filter by brand…" oninput="filterOrderTable()" style="max-width:180px" />
      <span id="orderCountLabel" style="font-size:11px;color:var(--dim);align-self:center"></span>
      <button class="export-btn" onclick="exportOrders()" style="margin-left:auto">⬇ CSV</button>
    </div>
    <div id="ordersContent"><div class="loading"><div class="spinner"></div> Loading…</div></div>
  </div>

</div><!-- /mainApp -->

<!-- SKU Detail Drawer -->
<div class="sku-drawer" id="skuDrawer">
  <button class="drawer-close" onclick="closeDrawer()">✕</button>
  <div id="drawerContent"></div>
</div>
<div id="drawerOverlay" onclick="closeDrawer()"
  style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:499"></div>

<script>
// ══════════════════════════════════════
// CONFIG — replace with your deployed Apps Script Web App URL
// ══════════════════════════════════════
const API_URL = 'https://script.google.com/macros/s/AKfycbwLTAdn7orjspALv4-K9-gtcSrHaZBDvgolZC34FiZoblSMKMFS8J9yPFOglrhOilwS/exec';

// ══════════════════════════════════════
// STATE
// ══════════════════════════════════════
let authToken    = null;
let displayName  = '';
let groupStores  = [];   // [{store_id, store_name}, ...]
let activeStoreId = 'all';
let allSkuRows   = [];
let allOrderRows = [];
const charts = {};
const TOOLTIP = { backgroundColor:'#0f1218', titleColor:'#f1f5f9', bodyColor:'#94a3b8', borderColor:'#222a38', borderWidth:1 };

// ── Formatters ──────────────────────────────────────────
const fmt  = n => '$'+(parseFloat(n)||0).toLocaleString('en-CA',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtK = n => { n=parseFloat(n)||0; return n>=1e6?'$'+(n/1e6).toFixed(2)+'M':n>=1e3?'$'+(n/1e3).toFixed(1)+'K':fmt(n); };
const fmtN = n => (parseInt(n)||0).toLocaleString();
const pct  = (a,b) => b>0?((parseFloat(a)||0)/(parseFloat(b)||1)*100).toFixed(1)+'%':'—';
const d    = s => s ? new Date(s).toLocaleDateString('en-CA',{year:'numeric',month:'short',day:'numeric'}) : '—';

function mkChart(id,cfg){ if(charts[id]) charts[id].destroy(); const c=document.getElementById(id); if(c) charts[id]=new Chart(c,cfg); }
function baseOpts(rot){ return { responsive:true, maintainAspectRatio:false, plugins:{ legend:{ labels:{ color:'#94a3b8', font:{size:10} } }, tooltip:TOOLTIP }, scales:{ x:{ grid:{color:'#1a2233'}, ticks:{color:'#475569',font:{size:10},maxRotation:rot||0} }, y:{ grid:{color:'#1a2233'}, ticks:{color:'#475569',font:{size:10}} } } }; }

// ══════════════════════════════════════
// AUTH
// ══════════════════════════════════════
async function doLogin() {
  const id = document.getElementById('loginId').value.trim() || _urlGroupId;
  const pw = document.getElementById('loginPw').value.trim();
  if (!id || !pw) { showLoginErr('Please enter your Customer ID and password.'); return; }

  const btn = document.getElementById('loginBtn');
  btn.disabled = true; btn.textContent = 'Signing in…';
  document.getElementById('loginErr').textContent = '';

  try {
    const res = await apiCall({ action:'login', group_id: id, password: pw });
    if (!res.ok) throw new Error(res.error || 'Login failed');

    authToken    = res.token;
    displayName  = res.display_name;
    groupStores  = res.stores || [];
    activeStoreId = 'all';

    sessionStorage.setItem('cp_token',  authToken);
    sessionStorage.setItem('cp_name',   displayName);
    sessionStorage.setItem('cp_stores', JSON.stringify(groupStores));

    _applySession();
    loadAll();
  } catch(e) {
    showLoginErr(e.message);
  } finally {
    btn.disabled = false; btn.textContent = 'Sign In';
  }
}

function _applySession() {
  document.getElementById('custName').textContent = displayName;
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('mainApp').style.display     = 'block';
  initDates();
  _buildStoreSelector();
}

function doLogout() {
  if (authToken) apiCall({ action:'logout', token: authToken }).catch(()=>{});
  authToken = null; displayName = ''; groupStores = []; activeStoreId = 'all';
  sessionStorage.removeItem('cp_token');
  sessionStorage.removeItem('cp_name');
  sessionStorage.removeItem('cp_stores');
  document.getElementById('mainApp').style.display     = 'none';
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('loginId').value = '';
  document.getElementById('loginPw').value = '';
  document.getElementById('loginErr').textContent = '';
}

function showLoginErr(msg) { document.getElementById('loginErr').textContent = msg; }

// ── URL ?id= → auto-fill Customer ID ─────────────────────
let _urlGroupId = '';  // fallback storage

function prefillIdFromUrl() {
  const params = new URLSearchParams(window.location.search);
  const id     = params.get('id');
  if (id) {
    _urlGroupId = id.toUpperCase();
    const field = document.getElementById('loginId');
    if (field) {
      field.value = _urlGroupId;
      document.getElementById('idFieldGroup').style.display = 'none';
      document.getElementById('loginPw').focus();
    }
  }
}

// ── Resume session from sessionStorage ───────────────────
function tryResumeSession() {
  prefillIdFromUrl();
  const token  = sessionStorage.getItem('cp_token');
  const name   = sessionStorage.getItem('cp_name');
  const stores = sessionStorage.getItem('cp_stores');
  if (token && name) {
    authToken    = token;
    displayName  = name;
    groupStores  = stores ? JSON.parse(stores) : [];
    activeStoreId = 'all';
    _applySession();
    initDates();
    loadAll();
  }
}

// ── Store selector ────────────────────────────────────────
function _buildStoreSelector() {
  const wrap = document.getElementById('storeSelectorWrap');
  const sel  = document.getElementById('storeSelector');

  if (groupStores.length <= 1) {
    // Single store — no dropdown needed
    wrap.style.display = 'none';
    return;
  }

  wrap.style.display = 'flex';
  sel.innerHTML =
    `<option value="all">All Stores (${groupStores.length})</option>` +
    groupStores.map(s => `<option value="${s.store_id}">${s.store_name}</option>`).join('');
  sel.value = activeStoreId;
}

function onStoreChange() {
  activeStoreId = document.getElementById('storeSelector').value;
  loadAll();
}

// DATES
// ══════════════════════════════════════
function initDates() {
  const today = new Date();
  const from  = new Date(today.getFullYear(), today.getMonth() - 11, 1);
  document.getElementById('dateFrom').value = from.toISOString().slice(0,10);
  document.getElementById('dateTo').value   = today.toISOString().slice(0,10);
}

function setQuick(months) {
  document.querySelectorAll('.q-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  const today = new Date();
  if (months === 0) {
    document.getElementById('dateFrom').value = '2022-01-01';
  } else {
    const from = new Date(today.getFullYear(), today.getMonth() - months + 1, 1);
    document.getElementById('dateFrom').value = from.toISOString().slice(0,10);
  }
  document.getElementById('dateTo').value = today.toISOString().slice(0,10);
  applyFilters();
}

function applyFilters() { loadAll(); }

function getDateParams() {
  return {
    date_from: document.getElementById('dateFrom').value,
    date_to:   document.getElementById('dateTo').value,
  };
}

// Track what state each tab was last loaded with (store + dates)
const _tabLoadKey = { overview:null, reco:null, skus:null, orders:null };
let _currentTab = 'overview';

function _stateKey() {
  return activeStoreId + '|' + document.getElementById('dateFrom').value + '|' + document.getElementById('dateTo').value;
}

function loadAll() {
  // Invalidate all tab caches (store or date changed)
  _tabLoadKey.overview = null;
  _tabLoadKey.reco     = null;
  _tabLoadKey.skus     = null;
  _tabLoadKey.orders   = null;
  // Load only the currently visible tab
  loadTab(_currentTab);
}

function loadTab(tab) {
  const key = _stateKey();
  if (_tabLoadKey[tab] === key) return; // already loaded with this state
  _tabLoadKey[tab] = key;
  if      (tab === 'overview') loadOverview();
  else if (tab === 'reco')     loadReco();
  else if (tab === 'skus')     loadSkus();
  else if (tab === 'orders')   loadOrders();
}

function switchTab(tab) {
  _currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.querySelector(`.tab-btn[onclick="switchTab('${tab}')"]`).classList.add('active');
  document.getElementById('tab-' + tab).classList.add('active');
  loadTab(tab);
}

async function loadOverview() {
  const el = document.getElementById('overviewContent');
  el.innerHTML = '<div class="loading"><div class="spinner"></div> Fetching your purchase summary…</div>';
  try {
    const showCompare = (activeStoreId === 'all' && groupStores.length > 1);
    const promises = [
      apiQuery('overview', getDateParams()),
      apiQuery('trend',    getDateParams()),
    ];
    if (showCompare) promises.push(apiQuery('store_compare', getDateParams()));

    const results = await Promise.all(promises);
    const kpi          = results[0];

    const storeCompare = showCompare ? results[2] : null;

}

let _recoGapDays = 90;

async function loadReco() {
  const el = document.getElementById('recoContent');
  el.innerHTML = '<div class="loading"><div class="spinner"></div> Finding opportunities…</div>';
  try {
    const [popular, gaps] = await Promise.all([
      apiQuery('recommendations', getDateParams()),
      apiQuery('reorder_gaps', { ...getDateParams(), gap_days: _recoGapDays, analysis_days: 365, min_count: 3 }),
    ]);
    renderReco(popular, gaps);
  } catch(e) { el.innerHTML = errState(e.message); }
}

async function reloadReorderGaps() {
  _recoGapDays = parseInt(document.getElementById('recoGapSel').value) || 90;
  const col = document.getElementById('reorderCol');
  if (col) col.innerHTML = '<div class="loading" style="padding:30px"><div class="spinner"></div></div>';
  try {
    const gaps = await apiQuery('reorder_gaps', { ...getDateParams(), gap_days: _recoGapDays, analysis_days: 365, min_count: 3 });
    if (col) col.innerHTML = _reorderColInner(gaps);
  } catch(e) { if (col) col.innerHTML = errState(e.message); }
}

function _recoCard(r, accent, metricLabel, metricVal) {
  const skuEsc  = (r.SKU||'').replace(/'/g,"\\'");
  const prodEsc = (r.product||'').replace(/'/g,"\\'");
  return `
    <div onmouseenter="showSkuPreview(event,'${skuEsc}','${prodEsc}')" onmouseleave="hideSkuPreview()" onclick="openSkuDrawer('${skuEsc}','${prodEsc}')"
      style="background:var(--surface2);border:1px solid var(--border);border-left:3px solid ${accent};border-radius:8px;padding:10px 12px;margin-bottom:8px;cursor:pointer;transition:border-color .15s"
      onmouseover="this.style.borderColor='${accent}'" onmouseout="this.style.borderColor='var(--border)';this.style.borderLeftColor='${accent}'">
      <div style="display:flex;justify-content:space-between;align-items:start;gap:8px">
        <div style="min-width:0;flex:1">
          <div style="font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${r.product||'—'}</div>
          <div style="font-family:monospace;font-size:10px;color:var(--blue2);margin-top:2px">${r.SKU||'—'} · <span style="color:var(--dim)">${r.brand||''}</span></div>
        </div>
        <div style="text-align:right;white-space:nowrap">
          <div style="font-size:9px;color:var(--dim);text-transform:uppercase">${metricLabel}</div>
          <div style="font-size:13px;font-weight:700;color:${accent}">${metricVal}</div>
        </div>
      </div>
    </div>`;
}

function _reorderColInner(gaps) {
  if (!gaps.length) {
    return `<div style="text-align:center;padding:30px 10px;color:var(--dim)"><div style="font-size:28px;margin-bottom:8px">✅</div><div style="font-size:12px">No lapsed items at this threshold.</div></div>`;
  }
  return gaps.map(r => _recoCard(r, 'var(--orange)', 'Days ago', (parseInt(r.days_since_last)||0)+'d')).join('');
}

function renderReco(popular, gaps) {
  const el = document.getElementById('recoContent');

  el.innerHTML = `
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px">

let _skuSort = { col: 'last_date', dir: 'desc' };

async function loadSkus() {
  const el = document.getElementById('skusContent');
  el.innerHTML = '<div class="loading"><div class="spinner"></div> Loading SKU analysis…</div>';
  try {
    const rows = await apiQuery('skus', getDateParams());
    allSkuRows = rows;
    populateBrandFilter(rows);
    renderSkuView();
  } catch(e) { el.innerHTML = errState(e.message); }
}

function populateBrandFilter(rows) {
  const brands = [...new Set(rows.map(r=>r.brand).filter(Boolean))].sort();
  const sel = document.getElementById('brandFilter');
  sel.innerHTML = '<option value="">All Brands</option>' + brands.map(b=>`<option value="${b}">${b}</option>`).join('');
}

function filterSkuTable() { renderSkuView(); }

function _getFilteredSkus() {
  const q   = (document.getElementById('skuSearch').value||'').toLowerCase();
  const brd = document.getElementById('brandFilter').value;
  return allSkuRows.filter(r => {
    const matchQ = !q || (r.SKU||'').toLowerCase().includes(q) || (r.product||'').toLowerCase().includes(q);
    const matchB = !brd || r.brand === brd;
    return matchQ && matchB;
  });
}

function sortSkus(col) {
  if (_skuSort.col === col) {
    _skuSort.dir = _skuSort.dir === 'asc' ? 'desc' : 'asc';
  } else {
    _skuSort.col = col;
    _skuSort.dir = (col === 'product' || col === 'brand' || col === 'SKU') ? 'asc' : 'desc';
  }
  renderSkuView();
}

function _applySkuSort(rows) {
  const { col, dir } = _skuSort;
  const mult = dir === 'asc' ? 1 : -1;
  const numeric = ['my_revenue','my_qty','my_orders','days_since_last'];
  return [...rows].sort((a,b) => {
    let av, bv;
    if (col === 'last_date') { av = a.last_date?new Date(a.last_date).getTime():0; bv = b.last_date?new Date(b.last_date).getTime():0; }
    else if (numeric.includes(col)) { av = parseFloat(a[col])||0; bv = parseFloat(b[col])||0; }
    else { av = (a[col]||'').toString().toLowerCase(); bv = (b[col]||'').toString().toLowerCase(); }
    if (av < bv) return -1*mult;
    if (av > bv) return  1*mult;
    return 0;
  });
}

function _sortArrow(col) {
  if (_skuSort.col !== col) return '<span style="color:var(--dim);opacity:.4">↕</span>';
  return _skuSort.dir === 'asc' ? '<span style="color:var(--blue2)">↑</span>' : '<span style="color:var(--blue2)">↓</span>';
}

function renderSkuView() {
  const el = document.getElementById('skusContent');
  let rows = _getFilteredSkus();
  document.getElementById('skuCountLabel').textContent = `${rows.length} SKUs`;
  if (!rows.length) { el.innerHTML = emptyState('No SKUs found.'); return; }

  const sorted = _applySkuSort(rows);
  window._skuRows = sorted;

  el.innerHTML = `
    <div class="tbl-card">
      <div class="tbl-hdr">
        <span class="tbl-title">My SKU Purchase History</span>
        <button class="export-btn" onclick="exportCSV(window._skuRows,'sku_analysis.csv')">⬇ CSV</button>
      </div>
      <div class="tbl-wrap">
        <table>
          <thead><tr>
            <th style="cursor:pointer" onclick="sortSkus('SKU')">SKU ${_sortArrow('SKU')}</th>
            <th style="cursor:pointer" onclick="sortSkus('product')">Product ${_sortArrow('product')}</th>
            <th style="cursor:pointer" onclick="sortSkus('brand')">Brand ${_sortArrow('brand')}</th>
            <th class="num" style="cursor:pointer" onclick="sortSkus('my_revenue')">Total Spend ${_sortArrow('my_revenue')}</th>
            <th class="num" style="cursor:pointer" onclick="sortSkus('my_qty')">Units ${_sortArrow('my_qty')}</th>
            <th class="num" style="cursor:pointer" onclick="sortSkus('my_orders')">Orders ${_sortArrow('my_orders')}</th>
            <th style="cursor:pointer" onclick="sortSkus('last_date')">Last Order ${_sortArrow('last_date')}</th>
            <th class="num" style="cursor:pointer" onclick="sortSkus('days_since_last')">Days Ago ${_sortArrow('days_since_last')}</th>
          </tr></thead>
          <tbody>
            ${sorted.map(r => {
              const days = parseInt(r.days_since_last)||0;
              const daysColor = days >= 180 ? 'var(--red)' : days >= 90 ? 'var(--orange)' : 'var(--dim)';
              const skuEsc  = (r.SKU||'').replace(/'/g,"\\'");
              const prodEsc = (r.product||'').replace(/'/g,"\\'");
              return `
                <tr onmouseenter="showSkuPreview(event,'${skuEsc}','${prodEsc}')" onmouseleave="hideSkuPreview()" style="cursor:pointer" onclick="openSkuDrawer('${skuEsc}','${prodEsc}')">
                  <td class="sku-tag">${r.SKU||'—'}</td>
                  <td style="max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${r.product||'—'}</td>
                  <td class="brand-tag">${r.brand||'—'}</td>
                  <td class="num">${fmt(r.my_revenue)}</td>
                  <td class="num">${fmtN(r.my_qty)}</td>
                  <td class="num">${fmtN(r.my_orders)}</td>
                  <td>${r.last_date ? new Date(r.last_date).toLocaleDateString('en-CA',{month:'short',day:'numeric',year:'numeric'}) : '—'}</td>
                  <td class="num" style="color:${daysColor};font-weight:${days>=90?'600':'400'}">${days}d</td>
                </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>
    </div>
  `;
}

// ── SKU hover preview (lightweight floating card with mini chart) ──
let _previewTimer = null;
let _previewCache = {};

function showSkuPreview(evt, sku, product) {
  clearTimeout(_previewTimer);
  const x = evt.clientX, y = evt.clientY;
  _previewTimer = setTimeout(async () => {
    let box = document.getElementById('skuPreviewBox');
    if (!box) {
      box = document.createElement('div');
      box.id = 'skuPreviewBox';
      box.style.cssText = 'position:fixed;z-index:600;width:320px;background:var(--surface);border:1px solid var(--border2);border-radius:10px;padding:14px;box-shadow:0 12px 40px rgba(0,0,0,.5);pointer-events:none';
      document.body.appendChild(box);
    }
    // Position near cursor, keep on screen
    const px = Math.min(x + 16, window.innerWidth - 340);
    const py = Math.min(y + 16, window.innerHeight - 240);
    box.style.left = px + 'px';
    box.style.top  = py + 'px';
    box.style.display = 'block';
    box.innerHTML = `<div style="font-size:12px;font-weight:600;margin-bottom:2px">${product}</div>
      <div style="font-family:monospace;font-size:11px;color:var(--blue2);margin-bottom:8px">${sku}</div>
      <div style="font-size:11px;color:var(--dim)">Loading…</div>`;

    try {
      let data = _previewCache[sku];
      if (!data) {
        data = await apiQuery('sku_detail', { ...getDateParams(), sku });
        _previewCache[sku] = data;
      }
      // box may have been hidden while loading
      if (box.style.display === 'none') return;
      const hist = data.my_history || [];
      const bench = data.benchmark || {};
      const totalQty = hist.reduce((s,r)=>(parseInt(r.qty)||0)+s,0);
      box.innerHTML = `
        <div style="font-size:12px;font-weight:600;margin-bottom:2px">${product}</div>
        <div style="font-family:monospace;font-size:11px;color:var(--blue2);margin-bottom:10px">${sku}</div>
        <div style="display:flex;gap:12px;margin-bottom:10px">
          <div><div style="font-size:9px;color:var(--dim);text-transform:uppercase">My Units</div><div style="font-size:15px;font-weight:700">${fmtN(totalQty)}</div></div>
          <div><div style="font-size:9px;color:var(--dim);text-transform:uppercase">Orders</div><div style="font-size:15px;font-weight:700">${fmtN(hist.reduce((s,r)=>(parseInt(r.orders)||0)+s,0))}</div></div>
          <div><div style="font-size:9px;color:var(--dim);text-transform:uppercase">Months</div><div style="font-size:15px;font-weight:700">${hist.length}</div></div>
        </div>
        <div style="height:90px"><canvas id="cPreviewChart"></canvas></div>
        <div style="font-size:10px;color:var(--dim);margin-top:6px;text-align:center">Click row for full detail</div>`;
      if (hist.length) {
        const ctx = document.getElementById('cPreviewChart');
        new Chart(ctx, {type:'bar',data:{labels:hist.map(r=>r.month),datasets:[
          {label:'Units',data:hist.map(r=>parseInt(r.qty)||0),backgroundColor:'rgba(59,130,246,.7)',borderRadius:2}
        ]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{enabled:false}},scales:{x:{grid:{display:false},ticks:{color:'#475569',font:{size:8}}},y:{grid:{color:'#1a2233'},ticks:{color:'#475569',font:{size:8}}}}}});
      }
    } catch(e) { /* ignore preview errors */ }
  }, 350); // delay so quick mouse passes don't fire
}

function hideSkuPreview() {
  clearTimeout(_previewTimer);
  const box = document.getElementById('skuPreviewBox');
  if (box) box.style.display = 'none';
}

async function openSkuDrawer(sku, product) {
  document.getElementById('skuDrawer').classList.add('open');
  document.getElementById('drawerOverlay').style.display = 'block';
  document.getElementById('drawerContent').innerHTML = `
    <div class="drawer-title">${product}</div>
    <div class="drawer-sku">${sku}</div>
    <div class="loading"><div class="spinner"></div> Loading SKU detail…</div>
  `;
  try {
    const data = await apiQuery('sku_detail', { ...getDateParams(), sku });
    renderDrawer(sku, product, data);
  } catch(e) {
    document.getElementById('drawerContent').innerHTML = errState(e.message);

function closeDrawer() {
  document.getElementById('skuDrawer').classList.remove('open');

}

  // Only surface "buying less than market" as a gentle suggestion (never "more")
  const buyingLess = avgQtyBuyer > 0 && myTotalQty < avgQtyBuyer * 0.7;

  // Last purchase recency
  let lastMonth = my_history.length ? my_history[my_history.length-1].month : null;

  document.getElementById('drawerContent').innerHTML = `
    <div class="drawer-title">${product}</div>

        <div class="bench-sub">most recent month</div>
      </div>
    </div>

    ${buyingLess ? `
    <div style="background:rgba(59,130,246,.08);border:1px solid var(--blue);border-radius:8px;padding:12px 14px;margin-bottom:18px">
      <div style="font-size:12px;font-weight:600;color:var(--blue2);margin-bottom:4px">💡 Stocking opportunity</div>

    </div>` : ''}

    <div class="card-hdr" style="margin-bottom:10px">
      <span class="card-title">Your Purchase History</span>
      <span class="card-badge">${my_history.length} months</span>
    </div>
    <div class="drawer-chart-box"><canvas id="cDrawerTrend"></canvas></div>

    ${my_history.length ? `
    <div class="tbl-card" style="margin-top:14px">
      <div class="tbl-wrap">
        <table>
          <thead><tr>
            <th>Month</th><th class="num">Units</th><th class="num">Orders</th>
          </tr></thead>
          <tbody>
            ${my_history.map(r=>`<tr>
              <td>${r.month}</td>

              <td class="num">${fmtN(r.orders)}</td>
            </tr>`).join('')}
          </tbody>
        </table>
      </div>
    </div>` : ''}
  `;

  if (my_history.length) {
    const labels = my_history.map(r=>r.month);
    mkChart('cDrawerTrend',{type:'bar',data:{labels,datasets:[
      {label:'Units',type:'bar',data:my_history.map(r=>parseInt(r.qty)||0),backgroundColor:'rgba(59,130,246,.7)',borderRadius:3,yAxisID:'yQ',order:2},
      {label:'Orders',type:'line',data:my_history.map(r=>parseInt(r.orders)||0),borderColor:'#2dd4bf',backgroundColor:'rgba(45,212,191,.2)',tension:.3,fill:false,pointRadius:3,pointBackgroundColor:'#2dd4bf',borderWidth:2.5,yAxisID:'yO',order:1},
    ]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:'#94a3b8',font:{size:10}}},tooltip:{...TOOLTIP,mode:'index'}},scales:{x:{grid:{color:'#1a2233'},ticks:{color:'#475569',font:{size:9}}},yQ:{position:'left',grid:{color:'#1a2233'},ticks:{color:'#475569',font:{size:9}}},yO:{position:'right',grid:{display:false},ticks:{color:'#475569',font:{size:9}}}}}});

function filterOrderTable() {
  const onum  = (document.getElementById('orderNumSearch').value||'').toLowerCase();

  const brand = (document.getElementById('orderBrandSearch').value||'').toLowerCase();
  const filtered = allOrderRows.filter(r => {
    const matchO = !onum  || (r.order_number||'').toLowerCase().includes(onum);

// ══════════════════════════════════════
// API HELPERS
// ══════════════════════════════════════
async function apiCall(body) {
  const payload  = encodeURIComponent(JSON.stringify(body));
  const cbName   = '_asung_cb_' + Date.now() + '_' + Math.random().toString(36).slice(2);
  const tagId    = '_jsonp_' + cbName;
  const url      = `${API_URL}?payload=${payload}&callback=${cbName}`;

  return new Promise((resolve, reject) => {
    const timer = setTimeout(() => {
      cleanup();
      reject(new Error('Request timed out'));
    }, 60000);

    function cleanup() {
      clearTimeout(timer);
      delete window[cbName];
      const el = document.getElementById(tagId);
      if (el) el.remove();
    }

    window[cbName] = (data) => {
      cleanup();
      resolve(data);
    };

    const script   = document.createElement('script');
    script.id      = tagId;
    script.src     = url;
    script.onerror = () => {
      cleanup();
      reject(new Error('Failed to fetch'));
    };
    document.head.appendChild(script);
  });
}

async function apiQuery(type, params) {
  const fullParams = { ...params, store_id: activeStoreId };
  const res = await apiCall({ action:'query', token: authToken, type, params: fullParams });
  if (!res.ok) {
    if (res.error && res.error.includes('Session expired')) {
      doLogout(); throw new Error('Session expired. Please sign in again.');
    }
    throw new Error(res.error || 'Query failed');
  }
  return res.data;
}

// ══════════════════════════════════════
// UTILITIES
// ══════════════════════════════════════
function exportCSV(rows, filename) {
  if (!rows || !rows.length) return;
  const keys = Object.keys(rows[0]);
  const csv  = [keys.join(','), ...rows.map(r => keys.map(k => {
    const v = r[k] == null ? '' : String(r[k]);
    return v.includes(',') || v.includes('"') || v.includes('\n') ? `"${v.replace(/"/g,'""')}"` : v;
  }).join(','))].join('\n');
  const a = document.createElement('a');
  a.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv);
  a.download = filename;
  a.click();
}

function errState(msg) {
  return `<div class="empty-state"><div class="empty-icon">⚠️</div><div class="empty-title">Error</div><div class="empty-desc">${msg}</div></div>`;
}
function emptyState(msg) {
  return `<div class="empty-state"><div class="empty-icon">📭</div><div class="empty-title">No Data</div><div class="empty-desc">${msg}</div></div>`;
}
