<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asung — My Account</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
/* ══════════════════════════════════════
   DESIGN TOKENS — same palette as internal apps
   ══════════════════════════════════════ */
:root {
  --bg:       #080a0f;
  --surface:  #0f1218;
  --surface2: #161b24;
  --surface3: #1c2330;
  --border:   #222a38;
  --border2:  #2a3446;
  --blue:     #3b82f6;
  --blue2:    #60a5fa;
  --green:    #22c55e;
  --red:      #ef4444;
  --yellow:   #eab308;
  --orange:   #f97316;
  --purple:   #a855f7;
  --teal:     #14b8a6;
  --text:     #f1f5f9;
  --mid:      #94a3b8;
  --dim:      #475569;
  --gold:     #f59e0b;
  --grid:     #1a2233;
}
*  { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'DM Sans', 'Segoe UI', sans-serif;
  font-size: 13px;
  min-height: 100vh;
}
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background: radial-gradient(ellipse 80% 50% at 50% -20%, rgba(59,130,246,.07), transparent);
  pointer-events: none;
  z-index: 0;
}

/* ── LOGIN ── */
#loginScreen {
  position: fixed; inset: 0; background: var(--bg); z-index: 9999;
  display: flex; align-items: center; justify-content: center;
}
.login-wrap { display: flex; flex-direction: column; align-items: center; gap: 28px; width: 100%; max-width: 400px; padding: 20px; }
.login-logo-mark {
  font-size: 42px; font-weight: 900; letter-spacing: -2px;
  background: linear-gradient(135deg, var(--blue), var(--teal));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.login-logo-img { display:block; height: 52px; width:auto; margin: 0 auto 4px; }
.hdr-logo-img   { display:block; height: 26px; width:auto; }
.login-logo-sub { font-size: 11px; letter-spacing: 4px; text-transform: uppercase; color: var(--dim); margin-top: 2px; text-align: center; }
.login-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 16px; padding: 36px 40px; width: 100%;
}
.login-title { font-size: 18px; font-weight: 700; margin-bottom: 6px; }
.login-sub   { font-size: 12px; color: var(--dim); margin-bottom: 28px; line-height: 1.6; }
.field-group  { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
.field-label  { font-size: 11px; color: var(--mid); letter-spacing: .5px; text-transform: uppercase; }
.field-input  {
  background: var(--surface2); border: 1px solid var(--border2);
  color: var(--text); border-radius: 8px; padding: 10px 14px;
  font-size: 13px; width: 100%; outline: none; font-family: inherit;
  transition: border-color .2s;
}
.field-input:focus { border-color: var(--blue); }
.login-btn {
  width: 100%; background: var(--blue); color: #fff; border: none;
  border-radius: 10px; padding: 13px; font-size: 14px; font-weight: 600;
  cursor: pointer; transition: all .2s; margin-top: 8px;
}
.login-btn:hover   { background: var(--blue2); transform: translateY(-1px); box-shadow: 0 8px 24px rgba(59,130,246,.3); }
.login-btn:active  { transform: translateY(0); }
.login-btn:disabled { opacity: .5; cursor: default; transform: none; }
.login-err { color: var(--red); font-size: 12px; margin-top: 12px; min-height: 16px; text-align: center; }
.login-note { font-size: 11px; color: var(--dim); text-align: center; }

/* ── MAIN APP ── */
#mainApp { display: none; position: relative; z-index: 1; }

/* ── HEADER ── */
.hdr {
  background: rgba(8,10,15,.92); backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border);
  padding: 0 24px; display: flex; align-items: center;
  justify-content: space-between; height: 56px;
  position: sticky; top: 0; z-index: 100;
}
.hdr-brand  { display: flex; align-items: center; gap: 10px; }
.hdr-logo   { font-size: 16px; font-weight: 800; letter-spacing: -.5px; background: linear-gradient(135deg, var(--blue), var(--teal)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.hdr-sep    { color: var(--border2); font-size: 18px; }
.hdr-title  { font-size: 13px; color: var(--mid); font-weight: 500; }
.hdr-right  { display: flex; align-items: center; gap: 12px; }
.hdr-cust   { font-size: 12px; color: var(--mid); }
.hdr-cust strong { color: var(--text); }
.hdr-signout {
  font-size: 11px; color: var(--dim); cursor: pointer;
  padding: 4px 10px; border: 1px solid var(--border);
  border-radius: 6px; transition: all .2s; background: none;
}
.hdr-signout:hover { color: var(--text); border-color: var(--border2); }
.hdr-shop {
  font-size: 11px; color: var(--blue2); cursor: pointer; text-decoration: none;
  padding: 4px 10px; border: 1px solid var(--border);
  border-radius: 6px; transition: all .2s; white-space: nowrap;
  display: inline-flex; align-items: center; gap: 5px;
}
.hdr-shop:hover { color: #fff; border-color: var(--blue); background: var(--blue); }
.hdr-logo-link { display: inline-flex; align-items: center; text-decoration: none; }

/* ── TAB NAV ── */
.tab-nav {
  display: flex; align-items: center; gap: 4px;
  padding: 0 24px; background: var(--surface);
  border-bottom: 1px solid var(--border);
  overflow-x: auto; -webkit-overflow-scrolling: touch;
}
.tab-btn {
  padding: 14px 16px; font-size: 12px; font-weight: 500;
  color: var(--dim); background: none; border: none;
  border-bottom: 2px solid transparent; cursor: pointer;
  white-space: nowrap; transition: all .15s;
}
.tab-btn:hover  { color: var(--mid); }
.tab-btn.active { color: var(--text); border-bottom-color: var(--blue); }

/* ── DATE FILTER BAR ── */
.filter-bar {
  background: var(--surface); border-bottom: 1px solid var(--border);
  padding: 10px 24px; display: flex; align-items: center;
  gap: 12px; flex-wrap: wrap;
}
.filter-label { font-size: 11px; color: var(--dim); white-space: nowrap; }
.filter-input {
  background: var(--surface2); border: 1px solid var(--border2);
  color: var(--text); border-radius: 6px; padding: 6px 10px;
  font-size: 12px; outline: none; font-family: inherit;
  transition: border-color .2s;
}
.filter-input:focus { border-color: var(--blue); }
.filter-btn {
  background: var(--blue); color: #fff; border: none;
  border-radius: 6px; padding: 6px 14px; font-size: 12px;
  font-weight: 600; cursor: pointer; transition: all .15s;
  white-space: nowrap;
}
.filter-btn:hover   { background: var(--blue2); }
.filter-btn.ghost   { background: none; border: 1px solid var(--border2); color: var(--mid); }
.filter-btn.ghost:hover { border-color: var(--blue); color: var(--text); }
.filter-sep { color: var(--border2); }
.quick-btns { display: flex; gap: 4px; }
.q-btn {
  font-size: 11px; padding: 4px 8px; background: var(--surface2);
  border: 1px solid var(--border); color: var(--dim);
  border-radius: 4px; cursor: pointer; transition: all .15s;
}
.q-btn:hover, .q-btn.active { background: var(--surface3); border-color: var(--blue2); color: var(--text); }

/* ── CONTENT ── */
.tab-panel { display: none; padding: 24px; }
.tab-panel.active { display: block; }

/* ── KPI STRIP ── */
.kpi-strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 20px; }
.kpi {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; padding: 16px 18px;
  border-left: 3px solid transparent;
}
.kpi.blue   { border-left-color: var(--blue); }
.kpi.green  { border-left-color: var(--green); }
.kpi.yellow { border-left-color: var(--yellow); }
.kpi.purple { border-left-color: var(--purple); }
.kpi.teal   { border-left-color: var(--teal); }
.kpi.orange { border-left-color: var(--orange); }
.kpi-lbl { font-size: 10px; text-transform: uppercase; letter-spacing: .8px; color: var(--dim); margin-bottom: 6px; }
.kpi-val { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
.kpi-sub { font-size: 11px; color: var(--dim); margin-top: 4px; }

/* ── CHARTS ── */
.charts-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; margin-bottom: 16px; }
.charts-row  { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; margin-bottom: 16px; }
.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; padding: 18px;
}
.card-hdr   { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.card-title { font-size: 12px; font-weight: 600; color: var(--text); }
.card-badge { font-size: 10px; background: var(--surface3); border: 1px solid var(--border2); border-radius: 4px; padding: 2px 6px; color: var(--dim); }
.chart-box      { height: 200px; }
.chart-box.tall { height: 240px; }

/* ── BENCHMARK PILL ── */
.bench-same   { color: var(--dim);   font-size: 10px; }

/* ── TABLES ── */
.tbl-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; overflow: hidden; margin-bottom: 16px;
}
.tbl-hdr {
  padding: 14px 18px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
}
.tbl-title { font-size: 12px; font-weight: 600; }
.tbl-count { font-size: 11px; color: var(--dim); }
.tbl-wrap  { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th {
  padding: 8px 12px; text-align: left; font-size: 10px;
  font-weight: 600; text-transform: uppercase; letter-spacing: .6px;
  color: var(--dim); background: var(--surface2);
  border-bottom: 1px solid var(--border); white-space: nowrap;
}
th.num, td.num { text-align: right; }
td {
  padding: 8px 12px; font-size: 12px; border-bottom: 1px solid var(--border);
  white-space: nowrap;
}
tr:last-child td { border-bottom: none; }
tr:hover td { background: var(--surface2); }
.sku-tag { font-family: monospace; font-size: 11px; color: var(--blue2); }
.pl-sort-btn {
  font-size: 11px; font-weight: 600; color: var(--mid); cursor: pointer;
  padding: 5px 12px; border: 1px solid var(--border); border-radius: 6px;
  background: var(--surface2); transition: all .15s; white-space: nowrap;
}
.pl-sort-btn:hover { color: var(--text); border-color: var(--border2); }
.pl-sort-btn.active { color: #fff; background: var(--blue); border-color: var(--blue); }
.deal-badge {
  display: inline-block; margin-top: 3px; font-size: 9px; font-weight: 700;
  color: #ef4444; background: rgba(239,68,68,0.12); border: 1px solid rgba(239,68,68,0.3);
  padding: 1px 5px; border-radius: 4px; white-space: nowrap;
}
.new-badge {
  display: inline-block; font-size: 9px; font-weight: 800; letter-spacing: .5px;
  color: #fff; background: linear-gradient(135deg, #f59e0b, #ef4444);
  padding: 2px 6px; border-radius: 4px; margin-right: 6px; vertical-align: middle;
  text-transform: uppercase;
}
tr.pl-new td { background: rgba(245, 158, 11, 0.04); }
tr.pl-new td:first-child { box-shadow: inset 3px 0 0 #f59e0b; }
.brand-tag { color: var(--mid); font-size: 11px; }
.loc-tor { color: var(--blue2); }
.loc-edm { color: var(--orange); }

/* ── SKU DETAIL DRAWER ── */
.sku-drawer {
  position: fixed; right: 0; top: 0; bottom: 0; width: 480px;
  background: var(--surface); border-left: 1px solid var(--border);
  z-index: 500; overflow-y: auto; transform: translateX(100%);
  transition: transform .25s ease; padding: 24px;
}
.sku-drawer.open { transform: translateX(0); }
.drawer-close {
  float: right; background: none; border: none;
  color: var(--mid); cursor: pointer; font-size: 18px;
  padding: 4px 8px; margin-top: -4px;
}
.drawer-close:hover { color: var(--text); }
.drawer-title { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
.drawer-sku   { font-family: monospace; font-size: 12px; color: var(--blue2); margin-bottom: 20px; }
.bench-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
.bench-card {
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 8px; padding: 12px 14px;
}
.bench-lbl { font-size: 10px; text-transform: uppercase; letter-spacing: .6px; color: var(--dim); margin-bottom: 4px; }
.bench-val { font-size: 18px; font-weight: 700; }
.bench-val.up   { color: var(--red); }
.bench-val.down { color: var(--green); }
.bench-sub { font-size: 10px; color: var(--dim); margin-top: 2px; }
.drawer-chart-box { height: 180px; margin-bottom: 20px; }

/* ── SEARCH BAR ── */
.search-row { display: flex; gap: 8px; margin-bottom: 16px; align-items: center; flex-wrap: wrap; }
.search-input {
  flex: 1; min-width: 200px; background: var(--surface2);
  border: 1px solid var(--border2); color: var(--text);
  border-radius: 8px; padding: 8px 12px; font-size: 12px;
  outline: none; font-family: inherit; transition: border-color .2s;
}
.search-input:focus { border-color: var(--blue); }
.search-select {
  background: var(--surface2); border: 1px solid var(--border2);
  color: var(--mid); border-radius: 8px; padding: 8px 10px;
  font-size: 12px; outline: none; cursor: pointer;
}

/* ── STATES ── */
.loading { display: flex; align-items: center; justify-content: center; gap: 12px; padding: 60px 20px; color: var(--dim); }
.spinner {
  width: 20px; height: 20px; border: 2px solid var(--border2);
  border-top-color: var(--blue); border-radius: 50%;
  animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.empty-state { text-align: center; padding: 60px 20px; }
.empty-icon  { font-size: 36px; margin-bottom: 12px; }
.empty-title { font-size: 15px; font-weight: 600; margin-bottom: 6px; }
.empty-desc  { font-size: 12px; color: var(--dim); }
.export-btn {
  font-size: 11px; padding: 4px 10px; background: var(--surface2);
  border: 1px solid var(--border2); color: var(--mid);
  border-radius: 5px; cursor: pointer; transition: all .15s;
}
.export-btn:hover { border-color: var(--blue); color: var(--text); }

/* ── STORE SELECTOR ── */
.store-select {
  background: var(--surface2); border: 1px solid var(--border2);
  color: var(--text); border-radius: 8px; padding: 5px 10px;
  font-size: 12px; font-weight: 500; outline: none; cursor: pointer;
  max-width: 220px; transition: border-color .2s;
}
.store-select:focus { border-color: var(--blue); }

/* ── ORDER SEARCH INPUTS ── */
.orders-search { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
.ord-toggle { background: var(--surface2); border: 1px solid var(--border); color: var(--mid); font-size: 12px; font-weight: 600; padding: 7px 14px; border-radius: 7px; cursor: pointer; transition: all .15s; }
.ord-toggle:hover { border-color: var(--border2); color: var(--text); }
.ord-toggle.active { background: var(--blue); border-color: var(--blue); color: #fff; }
/* Price list thumbnail hover-zoom */
.pl-thumb { position: relative; display: inline-block; }
.pl-thumb img.pl-thumb-img { width: 36px; height: 36px; object-fit: cover; border-radius: 5px; background: var(--surface3); cursor: zoom-in; display: block; }
.pl-thumb .pl-zoom { display: none; position: absolute; top: 50%; left: 44px; transform: translateY(-50%); z-index: 50; width: 220px; height: 220px; object-fit: contain; background: #fff; border: 1px solid var(--border2); border-radius: 10px; box-shadow: 0 8px 28px rgba(0,0,0,.45); padding: 6px; pointer-events: none; }
.pl-thumb:hover .pl-zoom { display: block; }

/* ── RESPONSIVE ── */
@media (max-width: 768px) {
  .hdr          { padding: 0 12px; }
  .hdr-title    { display: none; }
  .hdr-sep      { display: none; }
  .tab-panel    { padding: 12px; }
  .filter-bar   { padding: 8px 12px; }
  .charts-grid  { grid-template-columns: 1fr; }
  .kpi-strip    { grid-template-columns: repeat(2, 1fr); }
  .sku-drawer   { width: 100%; }
}
</style>
</head>
<body>

<!-- ══════════════════════════════════════
     LOGIN SCREEN
     ══════════════════════════════════════ -->
<div id="loginScreen">
  <div class="login-wrap">
    <div>
      <img class="login-logo-img" src="asung-logo-white.png" alt="Asung Trading Inc." />
      <div class="login-logo-sub">Customer Portal</div>
    </div>
    <div class="login-card">
      <div class="login-title">Sign in to your account</div>
      <div class="login-sub">Access your purchase history, trends, and insights from Asung Trading.</div>
      <div class="field-group" id="idFieldGroup">
        <div class="field-label">Customer ID</div>
        <input class="field-input" id="loginId" type="text" placeholder="e.g. G001" autocomplete="username" />
      </div>
      <div class="field-group">
        <div class="field-label">Password</div>
        <input class="field-input" id="loginPw" type="password" placeholder="Your portal password" autocomplete="current-password"
          onkeydown="if(event.key==='Enter')doLogin()" />
      </div>
      <button class="login-btn" id="loginBtn" onclick="doLogin()">Sign In</button>
      <div class="login-err" id="loginErr"></div>
    </div>
    <div class="login-note">Need access? Contact your Asung representative.</div>
  </div>
</div>

<!-- ══════════════════════════════════════
     MAIN APP
     ══════════════════════════════════════ -->
<div id="mainApp">

  <!-- Header -->
  <div class="hdr">
    <div class="hdr-brand">
      <a class="hdr-logo-link" href="https://www.asung.ca" target="_blank" rel="noopener" title="Go to asung.ca">
        <img class="hdr-logo-img" src="asung-logo-white.png" alt="Asung Trading Inc." />
      </a>
      <span class="hdr-sep">|</span>
      <span class="hdr-title">My Account</span>
    </div>
    <div class="hdr-right">
      <div id="storeSelectorWrap" style="display:none;align-items:center;gap:8px">
        <span style="font-size:11px;color:var(--dim)">Viewing:</span>
        <select id="storeSelector" class="store-select" onchange="onStoreChange()"></select>
      </div>
      <a class="hdr-shop" href="https://www.asung.ca" target="_blank" rel="noopener">🛒 Shop at asung.ca</a>
      <span class="hdr-sep" style="color:var(--border2)">|</span>
      <span class="hdr-cust">Signed in as <strong id="custName">—</strong></span>
      <button class="hdr-signout" onclick="doLogout()">Sign out</button>
    </div>
  </div>

  <!-- Tab nav -->
  <div class="tab-nav">
    <button class="tab-btn active" onclick="switchTab('overview')">📊 Overview</button>
    <button class="tab-btn" onclick="switchTab('reco')">🌟 Buy More / Reorder</button>
    <button class="tab-btn" onclick="switchTab('orders')">🧾 Order History</button>
    <button class="tab-btn" onclick="switchTab('pricelist')">🏷️ Price List</button>
  </div>

  <!-- Filter bar -->
  <div class="filter-bar" id="filterBar">
    <span class="filter-label">Period</span>
    <input class="filter-input" id="dateFrom" type="date" />
    <span class="filter-sep">—</span>
    <input class="filter-input" id="dateTo"   type="date" />
    <div class="quick-btns">
      <button class="q-btn" onclick="setQuick(3)">3M</button>
      <button class="q-btn" onclick="setQuick(6)">6M</button>
      <button class="q-btn" onclick="setQuick(12)">1Y</button>
      <button class="q-btn" onclick="setQuick(0)">All</button>
    </div>
    <button class="filter-btn" onclick="applyFilters()">Apply</button>
  </div>

  <!-- Tab: Overview -->
  <div class="tab-panel active" id="tab-overview">
    <div id="overviewContent"><div class="loading"><div class="spinner"></div> Loading your data…</div></div>
  </div>

  <!-- Tab: Recommendations -->
  <div class="tab-panel" id="tab-reco">
    <div id="recoContent"><div class="loading"><div class="spinner"></div> Loading…</div></div>
  </div>

  <!-- Tab: Price List -->
  <div class="tab-panel" id="tab-pricelist">
    <div class="orders-search">
      <input class="search-input" id="plSearch" placeholder="Search SKU or product…" oninput="filterPriceList()" style="max-width:240px" />
      <select class="search-select" id="plBrand" onchange="filterPriceList()" style="max-width:180px"><option value="">All Brands</option></select>
      <select class="search-select" id="plCategory" onchange="filterPriceList()" style="max-width:200px"><option value="">All Categories</option></select>
      <label id="plInStockWrap" style="display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--mid);cursor:pointer;user-select:none;white-space:nowrap">
        <input type="checkbox" id="plInStock" checked onchange="filterPriceList()" style="cursor:pointer;accent-color:var(--blue)">
        In-stock only
      </label>
      <span id="plCountLabel" style="font-size:11px;color:var(--dim);align-self:center"></span>
      <button class="export-btn" onclick="exportPriceList()" style="margin-left:auto">⬇ CSV</button>
    </div>
    <div style="display:flex;align-items:center;gap:8px;margin:0 0 12px 2px">
      <span style="font-size:11px;color:var(--dim)">Sort:</span>
      <button class="pl-sort-btn active" id="plSortDefault" onclick="setPlSort('default')">Default</button>
      <button class="pl-sort-btn" id="plSortNew" onclick="setPlSort('new')">🌟 New first</button>
      <button class="pl-sort-btn" id="plSortDeal" onclick="setPlSort('deal')">🔥 Best deals</button>
    </div>
    <div id="pricelistContent"><div class="loading"><div class="spinner"></div> Loading…</div></div>
  </div>

  <!-- Tab: Orders -->
  <div class="tab-panel" id="tab-orders">
    <div style="display:flex;gap:6px;margin-bottom:12px">
      <button id="ordViewByOrder" class="ord-toggle active" onclick="setOrderView('byorder')">📋 By Order</button>
      <button id="ordViewAll" class="ord-toggle" onclick="setOrderView('all')">📃 All Line Items</button>
    </div>
    <div class="orders-search">
      <input class="search-input" id="orderNumSearch" placeholder="Filter by order #…" oninput="filterOrderTableReset()" style="max-width:160px" />
      <input class="search-input" id="orderSkuSearch" placeholder="Filter by SKU or product…" oninput="filterOrderTableReset()" style="max-width:240px" />
      <input class="search-input" id="orderBrandSearch" placeholder="Filter by brand…" oninput="filterOrderTableReset()" style="max-width:180px" />
      <span id="orderCountLabel" style="font-size:11px;color:var(--dim);align-self:center"></span>
      <button class="export-btn" onclick="exportOrders()" style="margin-left:auto">⬇ CSV</button>
    </div>
    <div id="ordersContent"><div class="loading"><div class="spinner"></div> Loading…</div></div>
  </div>

</div><!-- /mainApp -->

<!-- SKU Detail Drawer -->
<div class="sku-drawer" id="skuDrawer">
  <button class="drawer-close" onclick="closeDrawer()">✕</button>
  <div id="drawerContent"></div>
</div>
<div id="drawerOverlay" onclick="closeDrawer()"
  style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:499"></div>

<script>
// ══════════════════════════════════════
// CONFIG — replace with your deployed Apps Script Web App URL
// ══════════════════════════════════════
const API_URL = 'https://script.google.com/macros/s/AKfycbwLTAdn7orjspALv4-K9-gtcSrHaZBDvgolZC34FiZoblSMKMFS8J9yPFOglrhOilwS/exec';

// ══════════════════════════════════════
// STATE
// ══════════════════════════════════════
let authToken    = null;
let displayName  = '';
let groupStores  = [];   // [{store_id, store_name}, ...]
let activeStoreId = 'all';
let allSkuRows   = []; // (legacy, unused)
let allOrderRows = [];
const charts = {};
const TOOLTIP = { backgroundColor:'#0f1218', titleColor:'#f1f5f9', bodyColor:'#94a3b8', borderColor:'#222a38', borderWidth:1 };

// ── Formatters ──────────────────────────────────────────
const fmt  = n => '$'+(parseFloat(n)||0).toLocaleString('en-CA',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtK = n => { n=parseFloat(n)||0; return n>=1e6?'$'+(n/1e6).toFixed(2)+'M':n>=1e3?'$'+(n/1e3).toFixed(1)+'K':fmt(n); };
const fmtN = n => (parseInt(n)||0).toLocaleString();
const pct  = (a,b) => b>0?((parseFloat(a)||0)/(parseFloat(b)||1)*100).toFixed(1)+'%':'—';
const d    = s => s ? new Date(s).toLocaleDateString('en-CA',{year:'numeric',month:'short',day:'numeric'}) : '—';

function mkChart(id,cfg){ if(charts[id]) charts[id].destroy(); const c=document.getElementById(id); if(c) charts[id]=new Chart(c,cfg); }
function baseOpts(rot){ return { responsive:true, maintainAspectRatio:false, plugins:{ legend:{ labels:{ color:'#94a3b8', font:{size:10} } }, tooltip:TOOLTIP }, scales:{ x:{ grid:{color:'#1a2233'}, ticks:{color:'#475569',font:{size:10},maxRotation:rot||0} }, y:{ grid:{color:'#1a2233'}, ticks:{color:'#475569',font:{size:10}} } } }; }

// ══════════════════════════════════════
// AUTH
// ══════════════════════════════════════
async function doLogin() {
  const id = document.getElementById('loginId').value.trim() || _urlGroupId;
  const pw = document.getElementById('loginPw').value.trim();
  if (!id || !pw) { showLoginErr('Please enter your Customer ID and password.'); return; }

  const btn = document.getElementById('loginBtn');
  btn.disabled = true; btn.textContent = 'Signing in…';
  document.getElementById('loginErr').textContent = '';

  try {
    const res = await apiCall({ action:'login', group_id: id, password: pw });
    if (!res.ok) throw new Error(res.error || 'Login failed');

    authToken    = res.token;
    displayName  = res.display_name;
    groupStores  = res.stores || [];
    activeStoreId = 'all';

    sessionStorage.setItem('cp_token',  authToken);
    sessionStorage.setItem('cp_name',   displayName);
    sessionStorage.setItem('cp_stores', JSON.stringify(groupStores));

    _applySession();
    loadAll();
  } catch(e) {
    showLoginErr(e.message);
  } finally {
    btn.disabled = false; btn.textContent = 'Sign In';
  }
}

function _applySession() {
  document.getElementById('custName').textContent = displayName;
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('mainApp').style.display     = 'block';
  initDates();
  _buildStoreSelector();
}

function doLogout() {
  if (authToken) apiCall({ action:'logout', token: authToken }).catch(()=>{});
  authToken = null; displayName = ''; groupStores = []; activeStoreId = 'all';
  sessionStorage.removeItem('cp_token');
  sessionStorage.removeItem('cp_name');
  sessionStorage.removeItem('cp_stores');
  document.getElementById('mainApp').style.display     = 'none';
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('loginId').value = '';
  document.getElementById('loginPw').value = '';
  document.getElementById('loginErr').textContent = '';
}

function showLoginErr(msg) { document.getElementById('loginErr').textContent = msg; }

// ── URL ?id= → auto-fill Customer ID ─────────────────────
let _urlGroupId = '';  // fallback storage

function prefillIdFromUrl() {
  const params = new URLSearchParams(window.location.search);
  const id     = params.get('id');
  if (id) {
    _urlGroupId = id.toUpperCase();
    const field = document.getElementById('loginId');
    if (field) {
      field.value = _urlGroupId;
      document.getElementById('idFieldGroup').style.display = 'none';
      document.getElementById('loginPw').focus();
    }
  }
}

// ── Resume session from sessionStorage ───────────────────
function tryResumeSession() {
  prefillIdFromUrl();
  const token  = sessionStorage.getItem('cp_token');
  const name   = sessionStorage.getItem('cp_name');
  const stores = sessionStorage.getItem('cp_stores');
  if (token && name) {
    authToken    = token;
    displayName  = name;
    groupStores  = stores ? JSON.parse(stores) : [];
    activeStoreId = 'all';
    _applySession();
    initDates();
    loadAll();
  }
}

// ── Store selector ────────────────────────────────────────
function _buildStoreSelector() {
  const wrap = document.getElementById('storeSelectorWrap');
  const sel  = document.getElementById('storeSelector');

  if (groupStores.length <= 1) {
    // Single store — no dropdown needed
    wrap.style.display = 'none';
    return;
  }

  wrap.style.display = 'flex';
  sel.innerHTML =
    `<option value="all">All Stores (${groupStores.length})</option>` +
    groupStores.map(s => `<option value="${s.store_id}">${s.store_name}</option>`).join('');
  sel.value = activeStoreId;
}

function onStoreChange() {
  activeStoreId = document.getElementById('storeSelector').value;
  loadAll();
}

// ══════════════════════════════════════
// DATES
// ══════════════════════════════════════
function initDates() {
  const today = new Date();
  const from  = new Date(today.getFullYear(), today.getMonth() - 11, 1);
  document.getElementById('dateFrom').value = from.toISOString().slice(0,10);
  document.getElementById('dateTo').value   = today.toISOString().slice(0,10);
}

function setQuick(months) {
  document.querySelectorAll('.q-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  const today = new Date();
  if (months === 0) {
    document.getElementById('dateFrom').value = '2022-01-01';
  } else {
    const from = new Date(today.getFullYear(), today.getMonth() - months + 1, 1);
    document.getElementById('dateFrom').value = from.toISOString().slice(0,10);
  }
  document.getElementById('dateTo').value = today.toISOString().slice(0,10);
  applyFilters();
}

function applyFilters() { loadAll(); }

function getDateParams() {
  return {
    date_from: document.getElementById('dateFrom').value,
    date_to:   document.getElementById('dateTo').value,
  };
}



// ══════════════════════════════════════
// LOAD ALL
// ══════════════════════════════════════
// Track what state each tab was last loaded with (store + dates)
const _tabLoadKey = { overview:null, reco:null, pricelist:null, orders:null };
let _currentTab = 'overview';
let _prefetchDone = {};

function _stateKey() {
  return activeStoreId + '|' + document.getElementById('dateFrom').value + '|' + document.getElementById('dateTo').value;
}

function loadAll() {
  // Invalidate all tab caches (store or date changed)
  _tabLoadKey.overview  = null;
  _tabLoadKey.reco      = null;
  _tabLoadKey.pricelist = null;
  _tabLoadKey.orders    = null;
  _prefetchDone = {};
  // Load only the currently visible tab
  loadTab(_currentTab);
}

function loadTab(tab) {
  const key = _stateKey();
  if (_tabLoadKey[tab] === key) return; // already loaded with this state
  _tabLoadKey[tab] = key;
  if      (tab === 'overview')  loadOverview();
  else if (tab === 'reco')      loadReco();
  else if (tab === 'pricelist') loadPriceList();
  else if (tab === 'orders')    loadOrders();
}

// Quietly pre-load the other tabs in the background so they open instantly.
function prefetchOtherTabs() {
  const key = _stateKey();
  if (_prefetchDone[key]) return;
  _prefetchDone[key] = true;
  const others = ['orders','pricelist','reco'].filter(t => t !== _currentTab);
  others.forEach((tab, i) => {
    setTimeout(() => {
      if (_tabLoadKey[tab] === key) return; // already loaded by user
      _tabLoadKey[tab] = key;
      if      (tab === 'reco')      loadReco();
      else if (tab === 'pricelist') loadPriceList();
      else if (tab === 'orders')    loadOrders();
    }, 600 * (i + 1));
  });
}

function switchTab(tab) {
  _currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.querySelector(`.tab-btn[onclick="switchTab('${tab}')"]`).classList.add('active');
  document.getElementById('tab-' + tab).classList.add('active');
  // Period filter is irrelevant on recommendations and price list tabs
  const fb = document.getElementById('filterBar');
  if (fb) fb.style.display = (tab === 'reco' || tab === 'pricelist') ? 'none' : '';
  loadTab(tab);
}

// ══════════════════════════════════════
// OVERVIEW TAB
// ══════════════════════════════════════
async function loadOverview() {
  const el = document.getElementById('overviewContent');
  el.innerHTML = '<div class="loading"><div class="spinner"></div> Fetching your purchase summary…</div>';
  try {
    const showCompare = (activeStoreId === 'all' && groupStores.length > 1);
    const promises = [
      apiQuery('overview', getDateParams()),
      apiQuery('trend',    getDateParams()),
    ];
    if (showCompare) promises.push(apiQuery('store_compare', getDateParams()));

    const results = await Promise.all(promises);
    const kpi          = results[0];
    const trend        = results[1];
    const storeCompare = showCompare ? results[2] : null;

    renderOverview(kpi, trend, storeCompare);
    prefetchOtherTabs();
  } catch(e) { el.innerHTML = errState(e.message); }
}

function renderOverview(kpi, trend, storeCompare) {
  const el = document.getElementById('overviewContent');
  const k  = Array.isArray(kpi) ? (kpi[0]||{}) : kpi;

  const torRev = parseFloat(k.toronto_rev)||0;
  const edmRev = parseFloat(k.edmonton_rev)||0;
  const totRev = parseFloat(k.total_revenue)||0;

  el.innerHTML = `
    <div class="kpi-strip">
      <div class="kpi blue">
        <div class="kpi-lbl">Total Purchases</div>
        <div class="kpi-val">${fmtK(k.total_revenue)}</div>
        <div class="kpi-sub">${fmtN(k.total_orders)} orders</div>
      </div>
      <div class="kpi yellow">
        <div class="kpi-lbl">Units Ordered</div>
        <div class="kpi-val">${fmtN(k.total_qty)}</div>
        <div class="kpi-sub">total units</div>
      </div>
      <div class="kpi purple">
        <div class="kpi-lbl">Unique SKUs</div>
        <div class="kpi-val">${fmtN(k.unique_skus)}</div>
        <div class="kpi-sub">${fmtN(k.unique_brands)} brands</div>
      </div>
      <div class="kpi blue">
        <div class="kpi-lbl">Toronto</div>
        <div class="kpi-val">${fmtK(torRev)}</div>
        <div class="kpi-sub">${totRev>0?(torRev/totRev*100).toFixed(1):0}% of spend</div>
      </div>
      <div class="kpi orange">
        <div class="kpi-lbl">Edmonton</div>
        <div class="kpi-val">${fmtK(edmRev)}</div>
        <div class="kpi-sub">${totRev>0?(edmRev/totRev*100).toFixed(1):0}% of spend</div>
      </div>
      <div class="kpi teal">
        <div class="kpi-lbl">Active Since</div>
        <div class="kpi-val" style="font-size:15px">${k.first_order ? new Date(k.first_order).toLocaleDateString('en-CA',{year:'numeric',month:'short'}) : '—'}</div>
        <div class="kpi-sub">Last order: ${k.last_order ? new Date(k.last_order).toLocaleDateString('en-CA',{month:'short',day:'numeric',year:'numeric'}) : '—'}</div>
      </div>
    </div>

    <div class="charts-grid">
      <div class="card">
        <div class="card-hdr">
          <span class="card-title">Monthly Spend</span>
          <span class="card-badge">${trend.length} months</span>
        </div>
        <div class="chart-box tall"><canvas id="cTrend"></canvas></div>
      </div>
      <div class="card">
        <div class="card-hdr"><span class="card-title">Units Ordered per Month</span></div>
        <div class="chart-box tall"><canvas id="cQty"></canvas></div>
      </div>
    </div>

    <div class="charts-row">
      <div class="card">
        <div class="card-hdr"><span class="card-title">Orders per Month</span></div>
        <div class="chart-box"><canvas id="cOrders"></canvas></div>
      </div>
      <div class="card">
        <div class="card-hdr"><span class="card-title">Branch Split</span></div>
        <div class="chart-box"><canvas id="cBranch"></canvas></div>
      </div>
      <div class="card">
        <div class="card-hdr"><span class="card-title">Avg Order Value</span></div>
        <div class="chart-box"><canvas id="cAOV"></canvas></div>
      </div>
    </div>

    <div id="storeCompareSection" style="display:none">
      <div style="font-size:12px;font-weight:600;color:var(--text);margin-bottom:12px;padding-top:8px;border-top:1px solid var(--border)">
        📍 Store Comparison
      </div>
      <div class="charts-row">
        <div class="card">
          <div class="card-hdr"><span class="card-title">Revenue by Store</span></div>
          <div class="chart-box tall"><canvas id="cStoreRev"></canvas></div>
        </div>
        <div class="card">
          <div class="card-hdr"><span class="card-title">Units by Store</span></div>
          <div class="chart-box tall"><canvas id="cStoreQty"></canvas></div>
        </div>
        <div class="card">
          <div class="card-hdr"><span class="card-title">Orders by Store</span></div>
          <div class="chart-box tall"><canvas id="cStoreOrd"></canvas></div>
        </div>
      </div>
    </div>
  `;

  const labels = trend.map(r=>r.month);
  const revData = trend.map(r=>parseFloat(r.revenue)||0);
  const qtyData = trend.map(r=>parseInt(r.qty)||0);
  const ordData = trend.map(r=>parseInt(r.orders)||0);
  const aovData = trend.map((r,i) => ordData[i]>0 ? revData[i]/ordData[i] : 0);

  mkChart('cTrend',{type:'bar',data:{labels,datasets:[
    {label:'Spend',data:revData,backgroundColor:'rgba(59,130,246,.7)',borderRadius:4}
  ]},options:{...baseOpts(),plugins:{...baseOpts().plugins,tooltip:{...TOOLTIP,callbacks:{label:ctx=>' '+fmt(ctx.raw)}}}}});

  mkChart('cQty',{type:'bar',data:{labels,datasets:[
    {label:'Units',data:qtyData,backgroundColor:'rgba(168,85,247,.7)',borderRadius:4}
  ]},options:{...baseOpts(),plugins:{...baseOpts().plugins,tooltip:{...TOOLTIP,callbacks:{label:ctx=>' '+ctx.raw.toLocaleString()}}}}});

  mkChart('cOrders',{type:'line',data:{labels,datasets:[
    {label:'Orders',data:ordData,borderColor:'#2dd4bf',backgroundColor:'rgba(45,212,191,.25)',tension:.3,fill:true,pointRadius:3,pointBackgroundColor:'#2dd4bf',borderWidth:2.5}
  ]},options:{...baseOpts(),plugins:{...baseOpts().plugins,tooltip:{...TOOLTIP}}}});

  mkChart('cBranch',{type:'doughnut',data:{
    labels:['Toronto','Edmonton'],
    datasets:[{data:[torRev,edmRev],backgroundColor:['rgba(59,130,246,.8)','rgba(249,115,22,.8)'],borderWidth:1,borderColor:'#080a0f'}]
  },options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{color:'#94a3b8',font:{size:10},boxWidth:10}},tooltip:{...TOOLTIP,callbacks:{label:ctx=>' '+fmt(ctx.raw)}}}}});

  mkChart('cAOV',{type:'line',data:{labels,datasets:[
    {label:'Avg Order Value',data:aovData,borderColor:'#fbbf24',backgroundColor:'rgba(251,191,36,.25)',tension:.3,fill:true,pointRadius:3,pointBackgroundColor:'#fbbf24',borderWidth:2.5}
  ]},options:{...baseOpts(),plugins:{...baseOpts().plugins,tooltip:{...TOOLTIP,callbacks:{label:ctx=>' '+fmt(ctx.raw)}}}}});

  // Store comparison charts (only when viewing All Stores)
  if (storeCompare && storeCompare.length > 1) {
    const scEl = document.getElementById('storeCompareSection');
    if (scEl) {
      scEl.style.display = 'block';
      const scLabels = storeCompare.map(s => s.store_name.replace(/Beauty Collection /gi,'').trim());
      const scRev    = storeCompare.map(s => parseFloat(s.revenue)||0);
      const scQty    = storeCompare.map(s => parseInt(s.qty)||0);
      const scOrd    = storeCompare.map(s => parseInt(s.orders)||0);
      const COLORS   = ['rgba(59,130,246,.8)','rgba(20,184,166,.8)','rgba(168,85,247,.8)','rgba(249,115,22,.8)','rgba(34,197,94,.8)','rgba(234,179,8,.8)'];

      mkChart('cStoreRev',{type:'bar',indexAxis:'y',data:{
        labels:scLabels,
        datasets:[{label:'Revenue',data:scRev,backgroundColor:COLORS.slice(0,scRev.length),borderRadius:3}]
      },options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{...TOOLTIP,callbacks:{label:ctx=>' '+fmt(ctx.raw)}}},scales:{x:{grid:{color:'#1a2233'},ticks:{color:'#475569',font:{size:9}}},y:{grid:{color:'#1a2233'},ticks:{color:'#94a3b8',font:{size:9}}}}}});

      mkChart('cStoreQty',{type:'bar',indexAxis:'y',data:{
        labels:scLabels,
        datasets:[{label:'Units',data:scQty,backgroundColor:COLORS.slice(0,scQty.length),borderRadius:3}]
      },options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{...TOOLTIP,callbacks:{label:ctx=>' '+ctx.raw.toLocaleString()+' units'}}},scales:{x:{grid:{color:'#1a2233'},ticks:{color:'#475569',font:{size:9}}},y:{grid:{color:'#1a2233'},ticks:{color:'#94a3b8',font:{size:9}}}}}});

      mkChart('cStoreOrd',{type:'bar',indexAxis:'y',data:{
        labels:scLabels,
        datasets:[{label:'Orders',data:scOrd,backgroundColor:COLORS.slice(0,scOrd.length),borderRadius:3}]
      },options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{...TOOLTIP}},scales:{x:{grid:{color:'#1a2233'},ticks:{color:'#475569',font:{size:9}}},y:{grid:{color:'#1a2233'},ticks:{color:'#94a3b8',font:{size:9}}}}}});
    }
  }
}

// ══════════════════════════════════════
// RECOMMENDATIONS TAB
// ══════════════════════════════════════
let _recoGapDays = 90;

// State for recommendations tab
let _recoState = {
  popularAll: [], gapsAll: [],
  popularShown: 30, gapsShown: 30,
  popularBrand: '', gapsBrand: '',
  PAGE: 30,
};

async function loadReco() {
  const el = document.getElementById('recoContent');
  el.innerHTML = '<div class="loading"><div class="spinner"></div> Finding opportunities…</div>';
  try {
    const [popular, gaps] = await Promise.all([
      apiQuery('recommendations', { ...getDateParams(), limit: 300 }),
      apiQuery('reorder_gaps', { ...getDateParams(), gap_days: _recoGapDays, analysis_days: 365, min_count: 3, limit: 300 }),
    ]);
    _recoState.popularAll   = popular || [];
    _recoState.gapsAll      = gaps || [];
    _recoState.popularShown = _recoState.PAGE;
    _recoState.gapsShown    = _recoState.PAGE;
    renderReco();
  } catch(e) { el.innerHTML = errState(e.message); }
}

async function reloadReorderGaps() {
  _recoGapDays = parseInt(document.getElementById('recoGapSel').value) || 90;
  const col = document.getElementById('reorderCol');
  if (col) col.innerHTML = '<div class="loading" style="padding:30px"><div class="spinner"></div></div>';
  try {
    const gaps = await apiQuery('reorder_gaps', { ...getDateParams(), gap_days: _recoGapDays, analysis_days: 365, min_count: 3, limit: 300 });
    _recoState.gapsAll   = gaps || [];
    _recoState.gapsShown = _recoState.PAGE;
    renderReco();
  } catch(e) { if (col) col.innerHTML = errState(e.message); }
}

// brand-filtered views
function _recoPopularFiltered() {
  const b = _recoState.popularBrand;
  return b ? _recoState.popularAll.filter(r => r.brand === b) : _recoState.popularAll;
}
function _recoGapsFiltered() {
  const b = _recoState.gapsBrand;
  return b ? _recoState.gapsAll.filter(r => r.brand === b) : _recoState.gapsAll;
}

function _recoBrandOptions(rows, selected) {
  const brands = [...new Set(rows.map(r=>r.brand).filter(Boolean))].sort();
  return '<option value="">All Brands</option>' +
    brands.map(b=>`<option value="${b}"${b===selected?' selected':''}>${b}</option>`).join('');
}

function onPopularBrand() { _recoState.popularBrand = document.getElementById('popBrandSel').value; _recoState.popularShown = _recoState.PAGE; renderReco(); }
function onGapsBrand()    { _recoState.gapsBrand    = document.getElementById('gapBrandSel').value; _recoState.gapsShown    = _recoState.PAGE; renderReco(); }
function showMorePopular(){ _recoState.popularShown += _recoState.PAGE; renderReco(); }
function showMoreGaps()   { _recoState.gapsShown    += _recoState.PAGE; renderReco(); }

async function exportReco(which) {
  try {
    if (which === 'popular') {
      const rows = _recoPopularFiltered().map(r=>({
        SKU:r.SKU, Product:r.product, Brand:r.brand,
        Units_Sold_6mo:r.market_qty, Stores_Buying:r.buyer_count, Orders:r.market_orders
      }));
      exportCSV(rows, 'popular_at_asung.csv');
    } else {
      const rows = _recoGapsFiltered().map(r=>({
        SKU:r.SKU, Product:r.product, Brand:r.brand,
        Times_Ordered:r.purchase_count, Total_Units:r.total_qty,
        Last_Purchase:r.last_purchase, Days_Since_Last:r.days_since_last
      }));
      exportCSV(rows, 'havent_reordered.csv');
    }
  } catch(e) { alert('Export failed: ' + e.message); }
}

function _recoCard(r, accent, metricLabel, metricVal) {
  const skuEsc  = (r.SKU||'').replace(/'/g,"\\'");
  const prodEsc = (r.product||'').replace(/'/g,"\\'");
  return `
    <div onmouseenter="showSkuPreview(event,'${skuEsc}','${prodEsc}')" onmouseleave="hideSkuPreview()" onclick="openSkuDrawer('${skuEsc}','${prodEsc}')"

}

// ── SKU hover preview (lightweight floating card with mini chart) ──
let _previewTimer = null;
let _skuDetailCache = {};   // shared by hover preview AND click drawer

function _skuCacheKey(sku) {
  return sku + '|' + document.getElementById('dateFrom').value + '|' + document.getElementById('dateTo').value;
}
async function getSkuDetail(sku) {
  const k = _skuCacheKey(sku);
  if (_skuDetailCache[k]) return _skuDetailCache[k];
  const p = apiQuery('sku_detail', { ...getDateParams(), sku });
  _skuDetailCache[k] = p;
  try { return await p; }
  catch(e) { delete _skuDetailCache[k]; throw e; }
}

function showSkuPreview(evt, sku, product) {
  clearTimeout(_previewTimer);
  const x = evt.clientX, y = evt.clientY;
  _previewTimer = setTimeout(async () => {
    let box = document.getElementById('skuPreviewBox');
    if (!box) {
      box = document.createElement('div');
      box.id = 'skuPreviewBox';
      box.style.cssText = 'position:fixed;z-index:600;width:320px;background:var(--surface);border:1px solid var(--border2);border-radius:10px;padding:14px;box-shadow:0 12px 40px rgba(0,0,0,.5);pointer-events:none';
      document.body.appendChild(box);
    }
    // Position near cursor, keep on screen
    const px = Math.min(x + 16, window.innerWidth - 340);
    const py = Math.min(y + 16, window.innerHeight - 240);
    box.style.left = px + 'px';
    box.style.top  = py + 'px';
    box.style.display = 'block';
    box.innerHTML = `<div style="font-size:12px;font-weight:600;margin-bottom:2px">${product}</div>
      <div style="font-family:monospace;font-size:11px;color:var(--blue2);margin-bottom:8px">${sku}</div>
      <div style="font-size:11px;color:var(--dim)">Loading…</div>`;

    try {
      const data = await getSkuDetail(sku);
      // box may have been hidden while loading
      if (box.style.display === 'none') return;
      const hist = data.my_history || [];
      const bench = data.benchmark || {};
      const totalQty = hist.reduce((s,r)=>(parseInt(r.qty)||0)+s,0);
      box.innerHTML = `
        <div style="font-size:12px;font-weight:600;margin-bottom:2px">${product}</div>
        <div style="font-family:monospace;font-size:11px;color:var(--blue2);margin-bottom:10px">${sku}</div>
        <div style="display:flex;gap:12px;margin-bottom:10px">
          <div><div style="font-size:9px;color:var(--dim);text-transform:uppercase">My Units</div><div style="font-size:15px;font-weight:700">${fmtN(totalQty)}</div></div>
          <div><div style="font-size:9px;color:var(--dim);text-transform:uppercase">Orders</div><div style="font-size:15px;font-weight:700">${fmtN(hist.reduce((s,r)=>(parseInt(r.orders)||0)+s,0))}</div></div>
          <div><div style="font-size:9px;color:var(--dim);text-transform:uppercase">Months</div><div style="font-size:15px;font-weight:700">${hist.length}</div></div>
        </div>
        <div style="height:90px"><canvas id="cPreviewChart"></canvas></div>
        <div style="font-size:10px;color:var(--dim);margin-top:6px;text-align:center">Click row for full detail</div>`;
      if (hist.length) {
        const ctx = document.getElementById('cPreviewChart');
        new Chart(ctx, {type:'bar',data:{labels:hist.map(r=>r.month),datasets:[
          {label:'Units',data:hist.map(r=>parseInt(r.qty)||0),backgroundColor:'rgba(59,130,246,.7)',borderRadius:2}
        ]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{enabled:false}},scales:{x:{grid:{display:false},ticks:{color:'#475569',font:{size:8}}},y:{grid:{color:'#1a2233'},ticks:{color:'#475569',font:{size:8}}}}}});
      }
    } catch(e) { /* ignore preview errors */ }
  }, 350); // delay so quick mouse passes don't fire
}

function hideSkuPreview() {
  clearTimeout(_previewTimer);
  const box = document.getElementById('skuPreviewBox');
  if (box) box.style.display = 'none';
}

async function openSkuDrawer(sku, product) {
  document.getElementById('skuDrawer').classList.add('open');
  document.getElementById('drawerOverlay').style.display = 'block';
  const k = _skuCacheKey(sku);
  if (_skuDetailCache[k]) {
    try {
      const data = await _skuDetailCache[k];
      renderDrawer(sku, product, data);
      return;
    } catch(e) { /* fall through to reload */ }
  }
  document.getElementById('drawerContent').innerHTML = `
    <div class="drawer-title">${product}</div>
    <div class="drawer-sku">${sku}</div>
    <div class="loading"><div class="spinner"></div> Loading SKU detail…</div>
  `;
  try {
    const data = await getSkuDetail(sku);
    renderDrawer(sku, product, data);
  } catch(e) {
    document.getElementById('drawerContent').innerHTML = errState(e.message);
  }
}

function closeDrawer() {
  document.getElementById('skuDrawer').classList.remove('open');
  document.getElementById('drawerOverlay').style.display = 'none';
  if (charts['cDrawerTrend']) { charts['cDrawerTrend'].destroy(); delete charts['cDrawerTrend']; }
}

  const buyingLess = avgQtyBuyer > 0 && myTotalQty < avgQtyBuyer * 0.7;

      </div>
      <div class="bench-card">
        <div class="bench-lbl">Avg Unit Price</div>
        <div class="bench-val">${avgUnitPx>0?fmt(avgUnitPx):'—'}</div>
        <div class="bench-sub">your price paid</div>
      </div>
      <div class="bench-card">
        <div class="bench-lbl">Last Purchase</div>
        <div class="bench-val" style="font-size:14px">${lastDate}</div>
        <div class="bench-sub">most recent order</div>
      </div>
    </div>

    ${buyingLess ? `
    <div style="background:rgba(59,130,246,.08);border:1px solid var(--blue);border-radius:8px;padding:12px 14px;margin-bottom:18px">
      <div style="font-size:12px;font-weight:600;color:var(--blue2);margin-bottom:4px">💡 Stocking opportunity</div>
      <div style="font-size:11px;color:var(--mid);line-height:1.5">Similar stores typically carry more of this item. You may want to consider increasing your order quantity.</div>
    </div>` : ''}

    <div class="card-hdr" style="margin-bottom:10px">
      <span class="card-title">Your Purchase History</span>
      <span class="card-badge">${my_history.length} months</span>
    </div>
    <div class="drawer-chart-box"><canvas id="cDrawerTrend"></canvas></div>

    ${my_history.length ? `
    <div class="tbl-card" style="margin-top:14px">
      <div class="tbl-wrap">
        <table>
          <thead><tr>
            <th>Month</th><th class="num">Units</th><th class="num">Orders</th>
          </tr></thead>

              <td>${r.month}</td>

    mkChart('cDrawerTrend',{type:'bar',data:{labels,datasets:[
      {label:'Units',type:'bar',data:my_history.map(r=>parseInt(r.qty)||0),backgroundColor:'rgba(59,130,246,.7)',borderRadius:3,yAxisID:'yQ',order:2},
      {label:'Orders',type:'line',data:my_history.map(r=>parseInt(r.orders)||0),borderColor:'#2dd4bf',backgroundColor:'rgba(45,212,191,.2)',tension:.3,fill:false,pointRadius:3,pointBackgroundColor:'#2dd4bf',borderWidth:2.5,yAxisID:'yO',order:1},
    ]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:'#94a3b8',font:{size:10}}},tooltip:{...TOOLTIP,mode:'index'}},scales:{x:{grid:{color:'#1a2233'},ticks:{color:'#475569',font:{size:9}}},yQ:{position:'left',grid:{color:'#1a2233'},ticks:{color:'#475569',font:{size:9}}},yO:{position:'right',grid:{display:false},ticks:{color:'#475569',font:{size:9}}}}}});

// PRICE LIST TAB
// ══════════════════════════════════════
let _plAll = [];
let _plTier = '';
let _plStockLoc = 'both';   // 'toronto' | 'edmonton' | 'both'
let _plSort = 'default';    // 'default' | 'new' | 'deal'
let _plShown = 100;
const _PL_PAGE = 100;

async function loadPriceList() {
  const el = document.getElementById('pricelistContent');
  el.innerHTML = '<div class="loading"><div class="spinner"></div> Loading price list…</div>';
  try {
    const res = await apiQuery('price_list', getDateParams());
    // res = { tier, stock_location, rows } or { error, rows }
    if (res.error === 'no_price_list') {
      el.innerHTML = emptyState('No price list is assigned to this store. Please contact Asung.');
      return;
    }
    _plAll  = res.rows || [];
    _plTier = res.tier || '';
    _plStockLoc = res.stock_location || 'both';
    _plShown = _PL_PAGE;
    _populatePlFilters(_plAll);
    renderPriceList();
  } catch(e) { el.innerHTML = errState(e.message); }
}

function _populatePlFilters(rows) {
  const brands = [...new Set(rows.map(r=>r.brand).filter(Boolean))].sort();
  const cats   = [...new Set(rows.map(r=>r.category).filter(Boolean))].sort();
  document.getElementById('plBrand').innerHTML = '<option value="">All Brands</option>' + brands.map(b=>`<option value="${b}">${b}</option>`).join('');
  document.getElementById('plCategory').innerHTML = '<option value="">All Categories</option>' + cats.map(c=>`<option value="${c}">${c}</option>`).join('');
}

function _plFiltered() {
  const q   = (document.getElementById('plSearch').value||'').toLowerCase();
  const brd = document.getElementById('plBrand').value;
  const cat = document.getElementById('plCategory').value;
  const inStockEl = document.getElementById('plInStock');
  const inStockOnly = inStockEl ? inStockEl.checked : false;

  // 재고 판단 — 보고 있는 브랜치(stock_location) 기준
  const showTO = _plStockLoc === 'toronto'  || _plStockLoc === 'both';
  const showED = _plStockLoc === 'edmonton' || _plStockLoc === 'both';
  const hasStock = (r) => {
    const to = _plNum(r.stock_toronto)  || 0;
    const ed = _plNum(r.stock_edmonton) || 0;
    if (showTO && showED) return to > 0 || ed > 0;  // 둘 중 하나라도 있으면
    if (showTO) return to > 0;
    if (showED) return ed > 0;
    return true;
  };

  const filtered = _plAll.filter(r => {
    const matchQ = !q || (r.sku||'').toLowerCase().includes(q) || (r.product||'').toLowerCase().includes(q) || (r.barcode||'').toLowerCase().includes(q);
    const matchB = !brd || r.brand === brd;
    const matchC = !cat || r.category === cat;
    const matchS = !inStockOnly || hasStock(r);
    return matchQ && matchB && matchC && matchS;
  });

  // 정렬 적용
  if (_plSort === 'new') {
    // 신제품 먼저, 같은 그룹 내에서는 등록일 최신순
    filtered.sort((a,b) => {
      const an = a.is_new ? 1 : 0, bn = b.is_new ? 1 : 0;
      if (an !== bn) return bn - an;
      if (an && bn) return String(b.registered_on||'').localeCompare(String(a.registered_on||''));
      return 0;
    });
  } else if (_plSort === 'deal') {
    // 실제 할인율 높은 순
    filtered.sort((a,b) => _plDiscountRate(b) - _plDiscountRate(a));
  }

  return filtered;
}

function filterPriceList() { _plShown = _PL_PAGE; renderPriceList(); }
function showMorePl() { _plShown += _PL_PAGE; renderPriceList(); }

function setPlSort(mode) {
  _plSort = mode;
  document.getElementById('plSortDefault').classList.toggle('active', mode==='default');
  document.getElementById('plSortNew').classList.toggle('active', mode==='new');
  document.getElementById('plSortDeal').classList.toggle('active', mode==='deal');
  _plShown = _PL_PAGE;
  renderPriceList();
}

// 실제 할인율 = (정가 - 할인가) / 정가  (0~1). 계산 불가 시 0.
function _plDiscountRate(r) {
  const list = _plNum(r.list_price);
  const your = _plNum(r.your_price);
  if (list === null || your === null || list <= 0) return 0;
  const rate = (list - your) / list;
  return rate > 0 ? rate : 0;
}

function _plNum(v) {
  const n = parseFloat(v);
  return isNaN(n) ? null : n;
}

function _volBadge(disc, price) {
  const p = _plNum(price);
  const d = (disc===undefined||disc===null) ? '' : String(disc).trim();
  if (!d || d === '-' || p === null) return '';
  // disc may be a qty threshold like "6" or "12"
  return `<span style="display:inline-block;background:var(--surface3);border:1px solid var(--border2);border-radius:4px;padding:1px 6px;font-size:10px;color:var(--mid);margin-right:4px">${d}+ : ${fmt(p)}</span>`;
}

function renderPriceList() {
  const el = document.getElementById('pricelistContent');
  const rows = _plFiltered();
  document.getElementById('plCountLabel').textContent =
    `${rows.length.toLocaleString()} items` + (_plTier ? ` · ${_plTier}` : '');

  if (!rows.length) { el.innerHTML = emptyState('No products found.'); return; }

  const show = rows.slice(0, _plShown);

  // 티어 기본 할인율 (예: "7pct" → 0.07). 이보다 높은 할인만 뱃지 표시.
  const tierPct = (parseFloat(String(_plTier).replace(/[^0-9.]/g,'')) || 0) / 100;

  // 재고 컬럼 구성 — store의 stock_location 설정에 따라
  const showTO = _plStockLoc === 'toronto'  || _plStockLoc === 'both';
  const showED = _plStockLoc === 'edmonton' || _plStockLoc === 'both';

  // 헤더 셀
  let stockHead = '';
  if (showTO && showED) {
    stockHead = `<th class="num">Stock<br><span style="font-size:9px;color:var(--mid);font-weight:500">Toronto</span></th>`
              + `<th class="num">Stock<br><span style="font-size:9px;color:var(--mid);font-weight:500">Edmonton</span></th>`;
  } else if (showTO) {
    stockHead = `<th class="num">Stock<br><span style="font-size:9px;color:var(--mid);font-weight:500">Toronto</span></th>`;
  } else {
    stockHead = `<th class="num">Stock<br><span style="font-size:9px;color:var(--mid);font-weight:500">Edmonton</span></th>`;
  }

  const stockCell = (v) => {
    const n = _plNum(v);
    return `<td class="num" style="color:${n>0?'var(--text)':'var(--red)'}">${n!==null?fmtN(n):'—'}</td>`;
  };

  el.innerHTML = `
    <div class="tbl-card">
      <div class="tbl-wrap">
        <table>
          <thead><tr>
            <th style="width:44px"></th>
            <th>SKU</th>
            <th>Product</th>
            <th>Brand</th>
            <th>Category</th>
            <th class="num">List Price</th>
            <th class="num">Your Price</th>
            ${stockHead}
            <th>Volume Pricing</th>
          </tr></thead>
          <tbody>
            ${show.map(r=>{
              const list = _plNum(r.list_price);
              const your = _plNum(r.your_price);
              const img = r.image
                ? `<span class="pl-thumb"><img src="${r.image}" loading="lazy" class="pl-thumb-img" onerror="this.parentNode.style.display='none'"><img src="${r.image}" loading="lazy" class="pl-zoom"></span>`
                : `<div style="width:36px;height:36px;border-radius:5px;background:var(--surface3)"></div>`;
              const vol = _volBadge(r.vol_disc1, r.vol_price1) + _volBadge(r.vol_disc2, r.vol_price2);
              let stockCells = '';
              if (showTO) stockCells += stockCell(r.stock_toronto);
              if (showED) stockCells += stockCell(r.stock_edmonton);
              const newBadge = r.is_new ? `<span class="new-badge" title="Registered ${r.registered_on||''}">NEW</span>` : '';
              // 실제 할인율이 티어 기본보다 높으면 특가 뱃지
              const dr = _plDiscountRate(r);
              const dealBadge = (dr > tierPct + 0.001 && list!==null)
                ? `<div class="deal-badge">🔥 ${Math.round(dr*100)}% off</div>` : '';
              return `<tr class="${r.is_new?'pl-new':''}">
                <td>${img}</td>
                <td class="sku-tag">${r.sku||'—'}</td>
                <td style="max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${newBadge}${r.product||'—'}</td>
                <td class="brand-tag">${r.brand||'—'}</td>
                <td style="font-size:11px;color:var(--mid)">${r.category||'—'}</td>
                <td class="num" style="color:var(--dim);text-decoration:line-through">${list!==null?fmt(list):'—'}</td>
                <td class="num" style="font-weight:700;color:var(--green)">${your!==null?fmt(your):'—'}${dealBadge}</td>
                ${stockCells}
                <td>${vol||'<span style="color:var(--dim);font-size:11px">—</span>'}</td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>
      ${_plShown < rows.length ? `<div style="padding:12px;text-align:center"><button onclick="showMorePl()" style="padding:8px 20px;background:var(--surface3);border:1px solid var(--border2);border-radius:6px;color:var(--blue2);font-size:12px;font-weight:600;cursor:pointer">▼ Show ${Math.min(_PL_PAGE, rows.length-_plShown)} more (${rows.length-_plShown} remaining)</button></div>` : ''}
    </div>
  `;
}

function exportPriceList() {
  const showTO = _plStockLoc === 'toronto'  || _plStockLoc === 'both';
  const showED = _plStockLoc === 'edmonton' || _plStockLoc === 'both';
  const rows = _plFiltered().map(r=>{
    const o = {
      SKU:r.sku, Product:r.product, Brand:r.brand, Category:r.category, Unit:r.unit,
      List_Price:r.list_price, Your_Price:r.your_price,
    };
    if (showTO) o.Stock_Toronto  = r.stock_toronto;
    if (showED) o.Stock_Edmonton = r.stock_edmonton;
    o.Barcode = r.barcode;
    return o;
  });
  exportCSV(rows, `price_list_${_plTier||'asung'}.csv`);
}

// ══════════════════════════════════════
// ORDERS TAB
// ══════════════════════════════════════
let _orderView = 'byorder';            // 'byorder' | 'all'
let _expandedOrders = {};              // track which orders are expanded
let _ordByShown = 50;                  // By Order: 표시할 주문 수
let _ordLineShown = 200;               // All Line Items: 표시할 라인 수
const _ORD_BY_PAGE = 50;
const _ORD_LINE_PAGE = 200;

async function loadOrders() {
  const el = document.getElementById('ordersContent');
  el.innerHTML = '<div class="loading"><div class="spinner"></div> Loading order history…</div>';
  try {
    const rows = await apiQuery('orders', getDateParams());
    allOrderRows = rows;
    _expandedOrders = {};
    _ordByShown   = _ORD_BY_PAGE;
    _ordLineShown = _ORD_LINE_PAGE;
    filterOrderTable();
  } catch(e) { el.innerHTML = errState(e.message); }
}

function setOrderView(view) {
  _orderView = view;
  _ordByShown   = _ORD_BY_PAGE;
  _ordLineShown = _ORD_LINE_PAGE;
  document.getElementById('ordViewByOrder').classList.toggle('active', view==='byorder');
  document.getElementById('ordViewAll').classList.toggle('active', view==='all');
  filterOrderTable();
}

function _getFilteredOrders() {
  const onum  = (document.getElementById('orderNumSearch').value||'').toLowerCase();
  const sku   = (document.getElementById('orderSkuSearch').value||'').toLowerCase();
  const brand = (document.getElementById('orderBrandSearch').value||'').toLowerCase();
  return allOrderRows.filter(r => {
    const matchO = !onum  || (r.order_number||'').toLowerCase().includes(onum);
    const matchS = !sku   || (r.SKU||'').toLowerCase().includes(sku) || (r.product||'').toLowerCase().includes(sku);
    const matchB = !brand || (r.brand||'').toLowerCase().includes(brand);
    return matchO && matchS && matchB;
  });
}

function filterOrderTable() {
  const filtered = _getFilteredOrders();
  window._orderRows = filtered;
  if (_orderView === 'byorder') renderOrdersByOrder(filtered);
  else                          renderOrderTable(filtered);
}

// 검색 입력/기간 변경 시 호출 — 페이지 카운터 리셋
function filterOrderTableReset() {
  _ordByShown   = _ORD_BY_PAGE;
  _ordLineShown = _ORD_LINE_PAGE;
  filterOrderTable();
}

function showMoreOrders() {
  if (_orderView === 'byorder') _ordByShown += _ORD_BY_PAGE;
  else                          _ordLineShown += _ORD_LINE_PAGE;
  filterOrderTable();
}

function toggleOrder(onum) {
  _expandedOrders[onum] = !_expandedOrders[onum];
  renderOrdersByOrder(_getFilteredOrders());
}

function renderOrdersByOrder(rows) {
  const el = document.getElementById('ordersContent');
  if (!rows.length) { el.innerHTML = emptyState('No orders found for this period.'); return; }

  // Group rows by order_number
  const groups = {};
  rows.forEach(r => {
    const k = r.order_number || '—';
    if (!groups[k]) groups[k] = { order_number:k, date:r.date, location:r.location, customer:r.customer, lines:[], total:0, qty:0 };
    groups[k].lines.push(r);
    groups[k].total += parseFloat(r.line_total)||0;
    groups[k].qty   += parseInt(r.qty)||0;
  });
  // Sort orders by date desc
  const orderList = Object.values(groups).sort((a,b)=> new Date(b.date) - new Date(a.date));

  document.getElementById('orderCountLabel').textContent =
    `${orderList.length.toLocaleString()} orders · ${rows.length.toLocaleString()} lines`;

  const showStore = groupStores.length > 1 && activeStoreId === 'all';
  const shownList = orderList.slice(0, _ordByShown);
  const remaining = orderList.length - _ordByShown;

  el.innerHTML = `
    <div class="tbl-card">
      <div class="tbl-wrap">
        <table>
          <thead><tr>
            <th style="width:30px"></th>
            <th>Order #</th>
            <th>Date</th>
            <th>Branch</th>
            ${showStore ? '<th>Store</th>' : ''}
            <th class="num">Items</th>
            <th class="num">Total Qty</th>
            <th class="num">Order Total</th>
          </tr></thead>
          <tbody>
            ${shownList.map(o => {
              const open = !!_expandedOrders[o.order_number];
              const onumEsc = (o.order_number||'').replace(/'/g,"\\'");
              const header = `
                <tr style="cursor:pointer;background:${open?'var(--surface2)':'transparent'}" onclick="toggleOrder('${onumEsc}')">
                  <td style="text-align:center;color:var(--blue2);font-weight:700">${open?'▾':'▸'}</td>
                  <td style="font-family:monospace;font-size:12px;font-weight:600;color:var(--blue2)">${o.order_number}</td>
                  <td>${o.date ? new Date(o.date).toLocaleDateString('en-CA',{month:'short',day:'numeric',year:'numeric'}) : '—'}</td>
                  <td class="${o.location==='Asung - Edmonton'?'loc-edm':'loc-tor'}">${o.location==='Asung - Edmonton'?'Edmonton':'Toronto'}</td>
                  ${showStore ? `<td style="font-size:11px;color:var(--mid)">${o.customer||'—'}</td>` : ''}
                  <td class="num">${o.lines.length}</td>
                  <td class="num">${fmtN(o.qty)}</td>
                  <td class="num" style="font-weight:700;color:var(--green)">${fmt(o.total)}</td>
                </tr>`;
              if (!open) return header;
              // Expanded detail rows
              const detail = `
                <tr><td colspan="${showStore?8:7}" style="padding:0;background:var(--surface)">
                  <div style="padding:4px 12px 12px 40px">
                    <table style="width:100%">
                      <thead><tr>
                        <th>SKU</th><th>Product</th><th>Brand</th>
                        <th class="num">Qty</th><th class="num">Your Price</th><th class="num">Line Total</th>
                      </tr></thead>
                      <tbody>
                        ${o.lines.map(r=>{
                          const skuEsc  = (r.SKU||'').replace(/'/g,"\\'");
                          const prodEsc = (r.product||'').replace(/'/g,"\\'");
                          return `<tr>
                            <td class="sku-tag" style="cursor:pointer" onmouseenter="showSkuPreview(event,'${skuEsc}','${prodEsc}')" onmouseleave="hideSkuPreview()" onclick="event.stopPropagation();openSkuDrawer('${skuEsc}','${prodEsc}')">${r.SKU||'—'}</td>
                            <td style="max-width:240px;overflow:hidden;text-overflow:ellipsis">${r.product||'—'}</td>
                            <td class="brand-tag">${r.brand||'—'}</td>
                            <td class="num">${fmtN(r.qty)}</td>
                            <td class="num">${fmt(r.unit_price)}</td>
                            <td class="num">${fmt(r.line_total)}</td>
                          </tr>`;
                        }).join('')}
                      </tbody>
                    </table>
                  </div>
                </td></tr>`;
              return header + detail;
            }).join('')}
          </tbody>
        </table>
      </div>
      ${remaining > 0 ? `<div style="padding:12px;text-align:center"><button onclick="showMoreOrders()" style="padding:8px 20px;background:var(--surface3);border:1px solid var(--border2);border-radius:6px;color:var(--blue2);font-size:12px;font-weight:600;cursor:pointer">▼ Show ${Math.min(_ORD_BY_PAGE, remaining)} more orders (${remaining.toLocaleString()} remaining)</button></div>` : ''}
    </div>
  `;
}

function renderOrderTable(rows) {
  const el = document.getElementById('ordersContent');
  document.getElementById('orderCountLabel').textContent = `${rows.length.toLocaleString()} lines`;
  if (!rows.length) { el.innerHTML = emptyState('No orders found for this period.'); return; }

  const shown = rows.slice(0, _ordLineShown);
  const remaining = rows.length - _ordLineShown;

  el.innerHTML = `
    <div class="tbl-card">
      <div class="tbl-wrap">
        <table>
          <thead><tr>
            <th>Date</th>
            <th>Order #</th>
            <th>SKU</th>
            <th>Product</th>
            <th>Brand</th>
            <th class="num">Qty</th>
            <th class="num">Your Price</th>
            <th class="num">Line Total</th>
            <th>Branch</th>
            ${groupStores.length > 1 && activeStoreId === 'all' ? '<th>Store</th>' : ''}
          </tr></thead>
          <tbody>
            ${shown.map(r=>{
              const skuEsc  = (r.SKU||'').replace(/'/g,"\\'");
              const prodEsc = (r.product||'').replace(/'/g,"\\'");
              return `<tr>
              <td>${r.date ? new Date(r.date).toLocaleDateString('en-CA',{month:'short',day:'numeric',year:'numeric'}) : '—'}</td>
              <td style="font-family:monospace;font-size:11px;color:var(--mid)">${r.order_number||'—'}</td>
              <td class="sku-tag" style="cursor:pointer" onmouseenter="showSkuPreview(event,'${skuEsc}','${prodEsc}')" onmouseleave="hideSkuPreview()" onclick="openSkuDrawer('${skuEsc}','${prodEsc}')">${r.SKU||'—'}</td>
              <td style="max-width:220px;overflow:hidden;text-overflow:ellipsis">${r.product||'—'}</td>
              <td class="brand-tag">${r.brand||'—'}</td>
              <td class="num">${fmtN(r.qty)}</td>
              <td class="num">${fmt(r.unit_price)}</td>
              <td class="num">${fmt(r.line_total)}</td>
              <td class="${r.location==='Asung - Edmonton'?'loc-edm':'loc-tor'}">${r.location==='Asung - Edmonton'?'Edmonton':'Toronto'}</td>
              ${groupStores.length > 1 && activeStoreId === 'all' ? `<td style="font-size:11px;color:var(--mid)">${r.customer||'—'}</td>` : ''}
            </tr>`;}).join('')}
          </tbody>
        </table>
      </div>
      ${remaining > 0 ? `<div style="padding:12px;text-align:center"><button onclick="showMoreOrders()" style="padding:8px 20px;background:var(--surface3);border:1px solid var(--border2);border-radius:6px;color:var(--blue2);font-size:12px;font-weight:600;cursor:pointer">▼ Show ${Math.min(_ORD_LINE_PAGE, remaining)} more lines (${remaining.toLocaleString()} remaining)</button></div>` : ''}
    </div>
  `;
  window._orderRows = rows;
}

function exportOrders() {
  const rows = window._orderRows || allOrderRows;
  if (!rows || !rows.length) return;
  const mapped = rows.map(r => ({
    Date:         r.date,
    Order:        r.order_number,
    Customer:     r.customer,
    SKU:          r.SKU,
    Product:      r.product,
    Brand:        r.brand,
    Qty:          r.qty,
    List_Price:   r.regular_price,
    Your_Price:   r.unit_price,
    Line_Total:   r.line_total,
    Location:     r.location,
  }));
  exportCSV(mapped, 'order_history.csv');
}

// ══════════════════════════════════════
// API HELPERS
// ══════════════════════════════════════
async function apiCall(body) {
  const payload  = encodeURIComponent(JSON.stringify(body));
  const cbName   = '_asung_cb_' + Date.now() + '_' + Math.random().toString(36).slice(2);
  const tagId    = '_jsonp_' + cbName;
  const url      = `${API_URL}?payload=${payload}&callback=${cbName}`;

  return new Promise((resolve, reject) => {
    const timer = setTimeout(() => {
      cleanup();
      reject(new Error('Request timed out'));
    }, 60000);

    function cleanup() {
      clearTimeout(timer);
      delete window[cbName];
      const el = document.getElementById(tagId);
      if (el) el.remove();
    }

    window[cbName] = (data) => {
      cleanup();
      resolve(data);
    };

    const script   = document.createElement('script');
    script.id      = tagId;
    script.src     = url;
    script.onerror = () => {
      cleanup();
      reject(new Error('Failed to fetch'));
    };
    document.head.appendChild(script);
  });
}

async function apiQuery(type, params) {
  const fullParams = { ...params, store_id: activeStoreId };
  const res = await apiCall({ action:'query', token: authToken, type, params: fullParams });
  if (!res.ok) {
    if (res.error && res.error.includes('Session expired')) {
      doLogout(); throw new Error('Session expired. Please sign in again.');
    }
    throw new Error(res.error || 'Query failed');
  }
  return res.data;
}

// ══════════════════════════════════════
// UTILITIES
// ══════════════════════════════════════
function exportCSV(rows, filename) {
  if (!rows || !rows.length) return;
  const keys = Object.keys(rows[0]);
  const csv  = [keys.join(','), ...rows.map(r => keys.map(k => {
    const v = r[k] == null ? '' : String(r[k]);
    return v.includes(',') || v.includes('"') || v.includes('\n') ? `"${v.replace(/"/g,'""')}"` : v;
  }).join(','))].join('\n');
  const a = document.createElement('a');
  a.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv);
  a.download = filename;
  a.click();
}

function errState(msg) {
  return `<div class="empty-state"><div class="empty-icon">⚠️</div><div class="empty-title">Error</div><div class="empty-desc">${msg}</div></div>`;
}
function emptyState(msg) {
  return `<div class="empty-state"><div class="empty-icon">📭</div><div class="empty-title">No Data</div><div class="empty-desc">${msg}</div></div>`;
}
